/* ---------- LOGIN REAL (Supabase Auth) ---------- */
function telaLoginNormal(){
  document.getElementById('loginConteudo').innerHTML = `
    <div class="login-campo"><label>E-mail</label><input type="email" id="loginEmail" value="${PERFIL_USUARIO.email}"></div>
    <div class="login-campo"><label>Senha</label><input type="password" id="loginSenha" placeholder="Sua senha"></div>
    <button class="login-btn" id="loginBtnEntrar" onclick="tentarLogin()">Entrar</button>
    <div id="loginErro" class="login-erro"></div>
    <div style="text-align:center;margin-top:14px;">
      <button onclick="telaCriarConta()" style="font-size:12px;color:var(--cor-primaria);font-weight:600;">Primeiro acesso? Criar minha conta</button>
    </div>
    <div class="login-aviso">Login real, protegido pelo Supabase — os dados agora ficam salvos na nuvem e sincronizam entre seus aparelhos.</div>`;
  setTimeout(()=>{
    const campoSenha = document.getElementById('loginSenha');
    if(campoSenha) campoSenha.addEventListener('keydown', e=>{ if(e.key==='Enter') tentarLogin(); });
  }, 0);
}
function telaCriarConta(){
  document.getElementById('loginConteudo').innerHTML = `
    <div style="font-size:12px;color:var(--cor-texto-suave);margin-bottom:16px;text-align:center;">Criar sua conta de acesso</div>
    <div class="login-campo"><label>E-mail</label><input type="email" id="cadastroEmail" value="${PERFIL_USUARIO.email}"></div>
    <div class="login-campo"><label>Criar senha</label><input type="password" id="cadastroSenha" placeholder="Mínimo 6 caracteres"></div>
    <div class="login-campo"><label>Confirmar senha</label><input type="password" id="cadastroSenha2"></div>
    <button class="login-btn" id="cadastroBtn" onclick="confirmarCadastro()">Criar conta</button>
    <div id="loginErro" class="login-erro"></div>
    <div style="text-align:center;margin-top:14px;">
      <button onclick="telaLoginNormal()" style="font-size:12px;color:var(--cor-texto-suave);font-weight:600;">← Já tenho conta, voltar pro login</button>
    </div>`;
}
async function confirmarCadastro(){
  const email = document.getElementById('cadastroEmail').value.trim();
  const s1 = document.getElementById('cadastroSenha').value;
  const s2 = document.getElementById('cadastroSenha2').value;
  const erro = document.getElementById('loginErro');
  const btn = document.getElementById('cadastroBtn');
  erro.innerText = '';
  if(!s1 || s1.length<6){ erro.innerText = 'A senha precisa ter pelo menos 6 caracteres.'; return; }
  if(s1!==s2){ erro.innerText = 'As senhas não coincidem.'; return; }
  btn.innerText = 'Criando...'; btn.disabled = true;
  const { data, error } = await supa.auth.signUp({ email, password: s1 });
  btn.innerText = 'Criar conta'; btn.disabled = false;
  if(error){ erro.innerText = error.message; return; }
  if(data.session){
    // conta criada e já logada (confirmação de e-mail desativada no projeto)
    entrarNoApp();
  } else {
    document.getElementById('loginConteudo').innerHTML = `
      <div style="text-align:center;padding:10px 0;">
        <div class="serif" style="font-size:16px;margin-bottom:10px;">Quase lá! 📩</div>
        <div style="font-size:12.5px;color:var(--cor-texto-suave);">Enviamos um e-mail de confirmação pra <strong>${email}</strong>. Clique no link do e-mail e depois volte aqui pra entrar.</div>
        <button class="login-btn" style="margin-top:18px;" onclick="telaLoginNormal()">Voltar para o login</button>
      </div>`;
  }
}
async function tentarLogin(){
  const email = document.getElementById('loginEmail').value.trim();
  const senha = document.getElementById('loginSenha').value;
  const erro = document.getElementById('loginErro');
  const btn = document.getElementById('loginBtnEntrar');
  erro.innerText = '';
  btn.innerText = 'Entrando...'; btn.disabled = true;
  const { data, error } = await supa.auth.signInWithPassword({ email, password: senha });
  btn.innerText = 'Entrar'; btn.disabled = false;
  if(error){
    erro.innerText = error.message.includes('Invalid login credentials')
      ? 'E-mail ou senha incorretos. Confira se o usuário já foi criado no Supabase (Authentication → Users).'
      : error.message;
    return;
  }
  entrarNoApp();
}
async function entrarNoApp(){
  document.getElementById('telaLogin').style.display = 'none';
  document.getElementById('appRoot').style.display = 'block';
  await carregarClientesSupabase();
  await carregarModeloChecklistSupabase();
  await carregarVisitasSupabase();
  await carregarEventosSupabase();
  await carregarLancamentosSupabase();
  await carregarLeadsSupabase();
  await carregarAtivosSupabase();
  await carregarHabitosSupabase();
  await carregarMetasPessoaisSupabase();
  await carregarContasPessoaisSupabase();
  await carregarComprasSupabase();
  await carregarIdeiasPessoaisSupabase();
  await carregarCicloSupabase();
  await carregarPixelSupabase();
  renderSidebar();
  renderTabbar();
  renderTela();
  setTimeout(verificarPendenciasAtrasadas, 2200);
}
async function sairDaConta(){
  await supa.auth.signOut();
  document.getElementById('appRoot').style.display = 'none';
  document.getElementById('telaLogin').style.display = 'flex';
  telaLoginNormal();
}

async function iniciarApp(){
  await carregarEstado();
  atualizarStatusConexao();
  renderSidebar();
  renderTabbar();
  renderTela();
  const { data: { session } } = await supa.auth.getSession();
  if(session){
    entrarNoApp();
  } else {
    telaLoginNormal();
  }
}
function verificarPendenciasAtrasadas(){
  const atrasados = LANCAMENTOS.filter(l=>statusRealLancamento(l)==='atrasado').length;
  if(atrasados>0){
    dispararAutomacao('Verificação automática de pendências', `${atrasados} lançamento(s) financeiro(s) atrasado(s) — veja em Pendências.`);
  }
}
iniciarApp();
</script>
