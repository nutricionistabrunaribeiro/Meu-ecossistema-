<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu Ecossistema — Bruna Ribeiro Consultoria</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cor-fundo:#F7F5EF;
    --cor-texto:#22231F;
    --cor-texto-suave:#6C6B62;
    --cor-primaria:#4FA579;
    --cor-primaria-clara:#6DC186;
    --cor-acento:#DD6D2D;
    --cor-superficie:#FFFFFF;
    --cor-borda:#E2E0D6;
    --radius:14px;
  }
  [data-espaco="pessoal"]{
    --cor-primaria:#DD6D2D;
    --cor-primaria-clara:#E8894F;
    --cor-acento:#4FA579;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--cor-fundo);
    color:var(--cor-texto);
    font-family:'Inter',sans-serif;
    display:flex;
    min-height:100vh;
    transition:background .2s;
  }
  h1,h2,h3,.serif{font-family:'Fraunces',serif;}
  button{font-family:inherit;border:none;background:none;cursor:pointer;}

  /* SIDEBAR */
  .sidebar{
    width:230px;background:var(--cor-superficie);border-right:1px solid var(--cor-borda);
    padding:28px 18px;display:flex;flex-direction:column;gap:22px;flex-shrink:0;
    position:sticky;top:0;height:100vh;overflow-y:auto;
  }
  .brand{display:flex;align-items:center;gap:10px;padding:0 6px;}
  .brand-mark{
    width:34px;height:34px;border-radius:9px;
    background:linear-gradient(135deg,var(--cor-primaria),var(--cor-primaria-clara));
    display:flex;align-items:center;justify-content:center;color:#fff;
    font-family:'Fraunces',serif;font-weight:600;font-size:16px;transition:background .2s;
  }
  .brand-name{font-family:'Fraunces',serif;font-size:15px;font-weight:600;line-height:1.15;}
  .brand-sub{font-size:10.5px;color:var(--cor-texto-suave);letter-spacing:.04em;}

  .space-switch{display:flex;background:var(--cor-fundo);border-radius:10px;padding:3px;font-size:12px;font-weight:600;}
  .space-switch button{flex:1;text-align:center;padding:7px 0;border-radius:8px;color:var(--cor-texto-suave);}
  .space-switch button.active{background:var(--cor-primaria);color:#fff;}

  nav{display:flex;flex-direction:column;gap:2px;}
  .nav-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--cor-texto-suave);margin:14px 8px 6px;}
  nav button{
    text-align:left;color:var(--cor-texto);font-size:13.5px;font-weight:500;
    padding:9px 10px;border-radius:9px;display:flex;align-items:center;gap:10px;width:100%;
  }
  nav button .dot{width:6px;height:6px;border-radius:50%;background:var(--cor-borda);flex-shrink:0;}
  nav button.active{background:var(--cor-fundo);color:var(--cor-primaria);font-weight:600;}
  nav button.active .dot{background:var(--cor-acento);}
  nav button:hover:not(.active){background:var(--cor-fundo);}

  /* MAIN */
  main{flex:1;padding:32px 40px;max-width:1180px;width:100%;}
  header.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;gap:16px;flex-wrap:wrap;}
  header.top h1{font-size:26px;font-weight:500;}
  header.top .date{color:var(--cor-texto-suave);font-size:13px;margin-top:2px;}
  .top-actions{display:flex;align-items:center;gap:12px;}
  .search{
    background:var(--cor-superficie);border:1px solid var(--cor-borda);border-radius:10px;
    padding:9px 14px;font-size:13px;color:var(--cor-texto-suave);width:220px;text-align:left;
  }
  .avatar{
    width:36px;height:36px;border-radius:50%;background:var(--cor-acento);color:#fff;
    display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-weight:600;font-size:14px;
    flex-shrink:0;
  }
  .menu-toggle{display:none;}

  .grid{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:18px;}
  .card{background:var(--cor-superficie);border:1px solid var(--cor-borda);border-radius:var(--radius);padding:20px;}
  .card h3{font-size:13.5px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;}
  .card h3 button{font-size:11.5px;color:var(--cor-primaria);font-weight:600;}

  .arco-wrap{display:flex;align-items:center;gap:18px;}
  .arco{position:relative;width:104px;height:104px;flex-shrink:0;}
  .arco svg{transform:rotate(-90deg);}
  .arco-label{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .arco-label .num{font-family:'Fraunces',serif;font-size:22px;font-weight:600;}
  .arco-label .txt{font-size:9.5px;color:var(--cor-texto-suave);}
  .arco-info .grande{font-family:'Fraunces',serif;font-size:17px;margin-bottom:4px;}
  .arco-info .peq{font-size:12px;color:var(--cor-texto-suave);}

  .agenda-item{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--cor-borda);font-size:13px;}
  .agenda-item:last-child{border-bottom:none;}
  .agenda-hora{color:var(--cor-primaria);font-weight:600;width:44px;flex-shrink:0;}
  .agenda-tipo{font-size:10.5px;color:var(--cor-texto-suave);}

  .pend-num{font-family:'Fraunces',serif;font-size:38px;font-weight:600;color:var(--cor-primaria);}
  .pend-desc{font-size:12px;color:var(--cor-texto-suave);margin-top:2px;}
  .pend-list{margin-top:14px;display:flex;flex-direction:column;gap:6px;}
  .pend-list li{list-style:none;font-size:12.5px;display:flex;justify-content:space-between;}
  .tag{font-size:10px;padding:2px 8px;border-radius:20px;background:var(--cor-fundo);color:var(--cor-texto-suave);}

  .cliente-row{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:13px;}
  .cliente-ini{width:26px;height:26px;border-radius:50%;background:var(--cor-fundo);color:var(--cor-primaria);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;}
  .cliente-sub{font-size:11px;color:var(--cor-texto-suave);}

  .fin-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;}
  .fin-val{font-family:'Fraunces',serif;font-size:19px;}
  .fin-pos{color:#3F6B4A;}
  .fin-neg{color:var(--cor-primaria);}
  .barra{height:6px;background:var(--cor-fundo);border-radius:6px;overflow:hidden;margin-top:10px;}
  .barra div{height:100%;background:var(--cor-acento);width:64%;}

  .proj-item{margin-bottom:12px;}
  .proj-item:last-child{margin-bottom:0;}
  .proj-nome{font-size:13px;font-weight:600;margin-bottom:5px;}
  .proj-barra{height:5px;background:var(--cor-fundo);border-radius:6px;overflow:hidden;}
  .proj-barra div{height:100%;background:var(--cor-primaria);}

  .conteudo-full{grid-column:1/4;}
  .conteudo-cards{display:flex;gap:14px;flex-wrap:wrap;}
  .conteudo-card{flex:1;min-width:150px;background:var(--cor-fundo);border-radius:10px;padding:14px;}
  .conteudo-card .status{font-size:10px;color:var(--cor-acento);font-weight:700;text-transform:uppercase;letter-spacing:.05em;}
  .conteudo-card .titulo{font-size:13px;font-weight:600;margin:6px 0 3px;}
  .conteudo-card .meta{font-size:11px;color:var(--cor-texto-suave);}

  .rapidos{grid-column:1/4;display:flex;gap:12px;flex-wrap:wrap;}
  .btn-rapido{flex:1;min-width:140px;background:var(--cor-superficie);border:1px dashed var(--cor-borda);border-radius:var(--radius);padding:16px;text-align:center;font-size:13px;font-weight:600;color:var(--cor-primaria);}
  .btn-rapido:hover{background:var(--cor-fundo);}

  /* Planner Semanal (Agenda) */
  .legenda{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:18px;}
  .legenda-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--cor-texto-suave);}
  .legenda-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .dot-visita{background:#8E5FB0;}
  .dot-demanda{background:#D98B3F;}
  .dot-pessoal{background:#4F8A5E;}
  .dot-financeiro{background:#C9A227;}

  .planner-scroll{overflow-x:auto;border:1px solid var(--cor-borda);border-radius:var(--radius);background:var(--cor-superficie);}
  .planner-grid{display:grid;grid-template-columns:56px repeat(7,minmax(120px,1fr));min-width:760px;}
  .planner-grid .col-head{
    position:sticky;top:0;background:var(--cor-superficie);padding:10px 6px;text-align:center;
    font-size:11.5px;font-weight:600;border-bottom:1px solid var(--cor-borda);border-left:1px solid var(--cor-borda);
  }
  .planner-grid .col-head span{display:block;font-size:9.5px;font-weight:400;color:var(--cor-texto-suave);}
  .planner-grid .canto{border-bottom:1px solid var(--cor-borda);}
  .planner-hora{
    font-size:10.5px;color:var(--cor-texto-suave);text-align:right;padding:6px 8px 0 0;
    border-top:1px solid var(--cor-borda);
  }
  .planner-cell{
    border-top:1px solid var(--cor-borda);border-left:1px solid var(--cor-borda);
    min-height:46px;padding:3px;cursor:pointer;position:relative;
  }
  .planner-cell:hover{background:var(--cor-fundo);}
  .evento-chip.concluido{text-decoration:line-through;opacity:.55;}
  .evento-chip{
    font-size:10.5px;color:#fff;border-radius:6px;padding:3px 6px;margin-bottom:2px;
    line-height:1.25;cursor:pointer;
  }
  .chip-visita{background:#8E5FB0;}
  .chip-demanda{background:#D98B3F;}
  .chip-pessoal{background:#4F8A5E;}
  .chip-financeiro{background:#C9A227;}

  .quick-add{
    position:absolute;z-index:20;background:#fff;border:1px solid var(--cor-borda);border-radius:10px;
    box-shadow:0 12px 30px rgba(0,0,0,.15);padding:10px;width:200px;top:0;left:0;
  }
  .quick-add input{width:100%;border:1px solid var(--cor-borda);border-radius:7px;padding:7px 8px;font-size:12.5px;font-family:inherit;margin-bottom:8px;}
  .quick-add .cores{display:flex;gap:6px;margin-bottom:8px;}
  .quick-add .cor-op{width:20px;height:20px;border-radius:50%;cursor:pointer;border:2px solid transparent;}
  .quick-add .cor-op.sel{border-color:var(--cor-texto);}
  .quick-add .acoes{display:flex;gap:6px;}
  .quick-add .acoes button{flex:1;font-size:11.5px;padding:6px;border-radius:6px;font-weight:600;}
  .quick-add .btn-confirmar{background:var(--cor-primaria);color:#fff;}
  .quick-add .btn-cancelar{background:var(--cor-fundo);color:var(--cor-texto-suave);}

  /* Modulo Clientes */
  .clientes-topo{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
  .clientes-busca{
    flex:1;min-width:180px;background:var(--cor-superficie);border:1px solid var(--cor-borda);
    border-radius:10px;padding:9px 14px;font-size:13px;font-family:inherit;
  }
  .btn-novo-cliente{
    background:var(--cor-primaria);color:#fff;border-radius:10px;padding:9px 16px;font-size:13px;font-weight:600;flex-shrink:0;
  }
  .lista-clientes{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;}
  .cliente-card{
    background:var(--cor-superficie);border:1px solid var(--cor-borda);border-radius:var(--radius);
    padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:10px;
  }
  .cliente-card:hover{border-color:var(--cor-primaria);}
  .cliente-card-topo{display:flex;align-items:center;gap:10px;}
  .cliente-card-ini{
    width:38px;height:38px;border-radius:10px;background:var(--cor-fundo);color:var(--cor-primaria);
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;
  }
  .cliente-card-nome{font-weight:600;font-size:14px;}
  .cliente-card-status{font-size:11px;color:var(--cor-texto-suave);}
  .prioridade-alta{background:#F6E1E5;color:#8E3A4A;}
  .prioridade-media{background:#F5EBD3;color:#8A6A1B;}
  .prioridade-baixa{background:#E4EEE4;color:#3F6B4A;}
  .prioridade-pill{font-size:10px;padding:2px 9px;border-radius:20px;font-weight:600;display:inline-block;width:fit-content;}

  /* Ficha do cliente */
  .ficha-voltar{font-size:12.5px;color:var(--cor-texto-suave);margin-bottom:14px;display:inline-flex;align-items:center;gap:5px;}
  .ficha-cabecalho{display:flex;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap;}
  .ficha-ini{
    width:52px;height:52px;border-radius:14px;background:var(--cor-primaria);color:#fff;
    display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-weight:600;font-size:18px;flex-shrink:0;
  }
  .ficha-nome{font-family:'Fraunces',serif;font-size:20px;}
  .ficha-sub{font-size:12px;color:var(--cor-texto-suave);}

  .abas{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--cor-borda);margin-bottom:18px;padding-bottom:0;}
  .abas button{
    font-size:12.5px;padding:9px 12px;color:var(--cor-texto-suave);white-space:nowrap;border-bottom:2px solid transparent;
  }
  .abas button.active{color:var(--cor-primaria);font-weight:600;border-bottom-color:var(--cor-primaria);}

  .aba-conteudo{background:var(--cor-superficie);border:1px solid var(--cor-borda);border-radius:var(--radius);padding:20px;}
  .campo{margin-bottom:14px;}
  .campo label{display:block;font-size:11px;color:var(--cor-texto-suave);margin-bottom:4px;}
  .campo .valor{font-size:13.5px;}
  .linha-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .item-lista-simples{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--cor-borda);font-size:13px;}
  .item-lista-simples:last-child{border-bottom:none;}

  /* Modulo Visitas Tecnicas */
  .visitas-lista{display:flex;flex-direction:column;gap:10px;margin-bottom:4px;}
  .visita-card{
    background:var(--cor-superficie);border:1px solid var(--cor-borda);border-radius:var(--radius);
    padding:14px 16px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;gap:10px;flex-wrap:wrap;
  }
  .visita-card:hover{border-color:var(--cor-primaria);}
  .visita-card-info{display:flex;align-items:center;gap:12px;}
  .visita-status-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .status-agendada{background:#C9A227;}
  .status-concluida{background:#4F8A5E;}
  .visita-nome{font-weight:600;font-size:13.5px;}
  .visita-meta{font-size:11.5px;color:var(--cor-texto-suave);}
  .visita-score-pill{font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:20px;background:var(--cor-fundo);color:var(--cor-primaria);}

  .etapa-tabs{display:flex;gap:6px;margin:18px 0;background:var(--cor-fundo);padding:4px;border-radius:10px;width:fit-content;}
  .etapa-tabs button{padding:8px 16px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--cor-texto-suave);}
  .etapa-tabs button.active{background:var(--cor-superficie);color:var(--cor-primaria);box-shadow:0 1px 3px rgba(0,0,0,.08);}

  .checklist-categoria{margin-bottom:20px;}
  .checklist-categoria h4{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--cor-texto-suave);margin-bottom:10px;}
  .checklist-item{border:1px solid var(--cor-borda);border-radius:10px;padding:12px 14px;margin-bottom:8px;}
  .checklist-item-topo{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
  .checklist-item-desc{font-size:13px;flex:1;min-width:180px;}
  .checklist-item-peso{font-size:10.5px;color:var(--cor-texto-suave);}
  .checklist-opcoes{display:flex;gap:6px;}
  .opcao-btn{font-size:11px;padding:6px 10px;border-radius:7px;border:1px solid var(--cor-borda);color:var(--cor-texto-suave);font-weight:600;}
  .opcao-btn.sel-conforme{background:#E4EEE4;color:#3F6B4A;border-color:#3F6B4A;}
  .opcao-btn.sel-nao_conforme{background:#F6E1E5;color:#8E3A4A;border-color:#8E3A4A;}
  .opcao-btn.sel-na{background:var(--cor-texto-suave);color:#fff;border-color:var(--cor-texto-suave);}
  .checklist-obs{width:100%;margin-top:8px;border:1px solid var(--cor-borda);border-radius:8px;padding:8px 10px;font-size:12.5px;font-family:inherit;}
  .checklist-fotos{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center;}
  .foto-thumb{position:relative;width:56px;height:56px;border-radius:8px;overflow:hidden;border:1px solid var(--cor-borda);}
  .foto-thumb img{width:100%;height:100%;object-fit:cover;}
  .foto-thumb .remover-foto{position:absolute;top:1px;right:1px;background:rgba(0,0,0,.55);color:#fff;font-size:10px;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .btn-add-foto{width:56px;height:56px;border-radius:8px;border:1px dashed var(--cor-borda);display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--cor-texto-suave);cursor:pointer;flex-shrink:0;}
  .btn-add-foto input{display:none;}

  .score-box{
    display:flex;align-items:center;gap:16px;background:var(--cor-superficie);border:1px solid var(--cor-borda);
    border-radius:var(--radius);padding:16px 20px;margin-bottom:18px;
  }
  .score-num{font-family:'Fraunces',serif;font-size:34px;}
  .score-boa{color:#2F6B4A;}
  .score-baixa{color:#8E3A4A;}
  .score-barra{flex:1;height:8px;background:var(--cor-fundo);border-radius:8px;overflow:hidden;}
  .score-barra div{height:100%;background:var(--cor-acento);}

  .assinatura-box{border:1px dashed var(--cor-borda);border-radius:10px;background:#fff;}
  .assinatura-box canvas{width:100%;height:120px;display:block;touch-action:none;cursor:crosshair;}
  .assinatura-linha{display:flex;justify-content:space-between;align-items:center;margin-top:6px;}
  .assinatura-linha span{font-size:11.5px;color:var(--cor-texto-suave);}
  .assinatura-linha button{font-size:11px;color:var(--cor-primaria);font-weight:600;}

  .relatorio-resumo-item{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--cor-borda);font-size:13px;}
  .relatorio-resumo-item:last-child{border-bottom:none;}

  .btn-primario{background:var(--cor-primaria);color:#fff;border-radius:10px;padding:11px 20px;font-size:13.5px;font-weight:600;}
  .btn-secundario{background:var(--cor-fundo);color:var(--cor-texto);border-radius:10px;padding:11px 20px;font-size:13.5px;font-weight:600;}

  /* Modulo Biblioteca */
  .biblio-topo{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
  .biblio-categorias{display:flex;gap:6px;flex-wrap:wrap;}
  .biblio-cat-btn{
    font-size:12px;padding:7px 13px;border-radius:20px;border:1px solid var(--cor-borda);color:var(--cor-texto-suave);font-weight:600;
  }
  .biblio-cat-btn.active{background:var(--cor-primaria);color:#fff;border-color:var(--cor-primaria);}
  .biblio-busca{flex:1;min-width:160px;background:var(--cor-superficie);border:1px solid var(--cor-borda);border-radius:10px;padding:9px 14px;font-size:13px;font-family:inherit;}
  .btn-upload{background:var(--cor-primaria);color:#fff;border-radius:10px;padding:9px 16px;font-size:13px;font-weight:600;flex-shrink:0;}

  .biblio-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;}
  .doc-card{background:var(--cor-superficie);border:1px solid var(--cor-borda);border-radius:var(--radius);padding:14px;cursor:pointer;}
  .doc-card:hover{border-color:var(--cor-primaria);}
  .doc-icone{
    width:38px;height:38px;border-radius:9px;background:var(--cor-fundo);color:var(--cor-primaria);
    display:flex;align-items:center;justify-content:center;font-size:15px;margin-bottom:10px;
  }
  .doc-nome{font-size:13px;font-weight:600;margin-bottom:3px;line-height:1.3;}
  .doc-meta{font-size:11px;color:var(--cor-texto-suave);display:flex;justify-content:space-between;align-items:center;}
  .doc-fav{color:var(--cor-acento);font-size:13px;}

  /* Modulo Financeiro */
  .fin-resumo{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px;}
  .fin-resumo-card{background:var(--cor-superficie);border:1px solid var(--cor-borda);border-radius:var(--radius);padding:16px;}
  .fin-resumo-label{font-size:11.5px;color:var(--cor-texto-suave);margin-bottom:6px;}
  .fin-resumo-valor{font-family:'Fraunces',serif;font-size:24px;}

  .fin-tabs{display:flex;gap:6px;margin-bottom:16px;background:var(--cor-fundo);padding:4px;border-radius:10px;width:fit-content;}
  .fin-tabs button{padding:8px 16px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--cor-texto-suave);}
  .fin-tabs button.active{background:var(--cor-superficie);color:var(--cor-primaria);box-shadow:0 1px 3px rgba(0,0,0,.08);}

  .fin-lista{background:var(--cor-superficie);border:1px solid var(--cor-borda);border-radius:var(--radius);overflow:hidden;}
  .fin-lancamento{display:flex;justify-content:space-between;align-items:center;padding:13px 18px;border-bottom:1px solid var(--cor-borda);font-size:13px;gap:10px;flex-wrap:wrap;}
  .fin-lancamento:last-child{border-bottom:none;}
  .fin-lanc-desc{font-weight:600;}
  .fin-lanc-meta{font-size:11px;color:var(--cor-texto-suave);}
  .fin-lanc-valor{font-family:'Fraunces',serif;font-size:15px;}
  .status-pago{color:#3F6B4A;}
  .status-aberto{color:var(--cor-acento);}
  .status-atrasado{color:#B0413E;}

  .meta-card{background:var(--cor-superficie);border:1px solid var(--cor-borda);border-radius:var(--radius);padding:18px;margin-top:16px;}

  /* Modulo Comercial */
  .pipeline-topo{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
  .btn-novo-lead{background:var(--cor-primaria);color:#fff;border-radius:10px;padding:9px 16px;font-size:13px;font-weight:600;}
  .pipeline-scroll{overflow-x:auto;}
  .pipeline{display:flex;gap:14px;min-width:900px;}
  .pipeline-coluna{flex:1;min-width:170px;background:var(--cor-fundo);border-radius:var(--radius);padding:12px;}
  .pipeline-coluna-titulo{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--cor-texto-suave);margin-bottom:10px;display:flex;justify-content:space-between;}
  .lead-card{
    background:var(--cor-superficie);border:1px solid var(--cor-borda);border-radius:10px;padding:12px;margin-bottom:10px;
    cursor:grab;
  }
  .lead-nome{font-size:12.5px;font-weight:600;margin-bottom:4px;}
  .lead-valor{font-size:12px;color:var(--cor-primaria);font-weight:600;margin-bottom:6px;}
  .lead-meta{font-size:10.5px;color:var(--cor-texto-suave);}
  .lead-mover{display:flex;gap:5px;margin-top:8px;}
  .lead-mover button{font-size:10px;padding:3px 7px;border-radius:6px;background:var(--cor-fundo);color:var(--cor-texto-suave);font-weight:600;}
  .lead-mover button:hover{background:var(--cor-borda);}

  /* Modulo Projetos */
  .projetos-topo{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
  .btn-novo-projeto{background:var(--cor-primaria);color:#fff;border-radius:10px;padding:9px 16px;font-size:13px;font-weight:600;}
  .projetos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;}
  .projeto-card{background:var(--cor-superficie);border:1px solid var(--cor-borda);border-radius:var(--radius);padding:16px;cursor:pointer;}
  .projeto-card:hover{border-color:var(--cor-primaria);}
  .projeto-card-nome{font-weight:600;font-size:14px;margin-bottom:3px;}
  .projeto-card-cliente{font-size:11.5px;color:var(--cor-texto-suave);margin-bottom:12px;}
  .projeto-card-perc{font-size:11.5px;font-weight:700;color:var(--cor-primaria);margin-top:6px;}

  .etapas-timeline{display:flex;flex-direction:column;gap:0;}
  .etapa-bloco{display:flex;gap:14px;position:relative;padding-bottom:22px;}
  .etapa-bloco:last-child{padding-bottom:0;}
  .etapa-linha{width:2px;background:var(--cor-borda);position:absolute;left:11px;top:26px;bottom:0;}
  .etapa-bloco:last-child .etapa-linha{display:none;}
  .etapa-marca{width:24px;height:24px;border-radius:50%;background:var(--cor-fundo);border:2px solid var(--cor-borda);display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;z-index:1;}
  .etapa-marca.concluida{background:#4F8A5E;border-color:#4F8A5E;color:#fff;}
  .etapa-marca.andamento{background:var(--cor-acento);border-color:var(--cor-acento);color:#fff;}
  .etapa-conteudo{flex:1;background:var(--cor-superficie);border:1px solid var(--cor-borda);border-radius:12px;padding:14px;}
  .etapa-titulo{font-weight:600;font-size:13.5px;margin-bottom:2px;}
  .etapa-status-txt{font-size:11px;color:var(--cor-texto-suave);margin-bottom:10px;}
  .etapa-check-item{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:5px 0;cursor:pointer;}
  .etapa-check-item input{accent-color:var(--cor-primaria);}
  .etapa-check-item.done{color:var(--cor-texto-suave);text-decoration:line-through;}

  /* Modulo Marketing */
  .mkt-topo{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
  .btn-nova-ideia{background:var(--cor-primaria);color:#fff;border-radius:10px;padding:9px 16px;font-size:13px;font-weight:600;}
  .mkt-tabs{display:flex;gap:6px;margin-bottom:16px;background:var(--cor-fundo);padding:4px;border-radius:10px;width:fit-content;}
  .mkt-tabs button{padding:8px 16px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--cor-texto-suave);}
  .mkt-tabs button.active{background:var(--cor-superficie);color:var(--cor-primaria);box-shadow:0 1px 3px rgba(0,0,0,.08);}

  .mkt-kanban{display:flex;gap:14px;overflow-x:auto;}
  .mkt-coluna{flex:1;min-width:210px;background:var(--cor-fundo);border-radius:var(--radius);padding:12px;}
  .mkt-coluna-titulo{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--cor-texto-suave);margin-bottom:10px;}
  .mkt-card{background:var(--cor-superficie);border:1px solid var(--cor-borda);border-radius:10px;padding:12px;margin-bottom:10px;}
  .mkt-card-tipo{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--cor-acento);margin-bottom:5px;}
  .mkt-card-titulo{font-size:12.5px;font-weight:600;margin-bottom:4px;}
  .mkt-card-data{font-size:10.5px;color:var(--cor-texto-suave);}

  .ideia-card{background:var(--cor-superficie);border:1px solid var(--cor-borda);border-radius:var(--radius);padding:14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .ideia-titulo{font-size:13px;font-weight:600;}
  .ideia-tags{font-size:11px;color:var(--cor-texto-suave);margin-top:3px;}
  .btn-usar-ideia{font-size:11.5px;font-weight:600;color:var(--cor-primaria);flex-shrink:0;}

  .data-comemorativa{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--cor-borda);font-size:13px;}
  .data-comemorativa:last-child{border-bottom:none;}

  /* Modulo Estudos */
  .estudos-filtros{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;}
  .estudos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;}
  .estudo-card{background:var(--cor-superficie);border:1px solid var(--cor-borda);border-radius:var(--radius);padding:16px;cursor:pointer;}
  .estudo-card:hover{border-color:var(--cor-primaria);}
  .estudo-tipo-tag{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--cor-acento);margin-bottom:6px;}
  .estudo-titulo{font-size:13.5px;font-weight:600;margin-bottom:10px;}
  .estudo-perc{font-size:11px;color:var(--cor-texto-suave);margin-top:6px;}

  .anotacao-item{border-bottom:1px solid var(--cor-borda);padding:10px 0;font-size:12.5px;}
  .anotacao-item:last-child{border-bottom:none;}
  .anotacao-data{font-size:10.5px;color:var(--cor-texto-suave);margin-bottom:3px;}
  .add-anotacao{display:flex;gap:8px;margin-top:14px;}
  .add-anotacao input{flex:1;border:1px solid var(--cor-borda);border-radius:8px;padding:9px 12px;font-size:12.5px;font-family:inherit;}
  .add-anotacao button{background:var(--cor-primaria);color:#fff;border-radius:8px;padding:9px 14px;font-size:12px;font-weight:600;}

  /* Modulo Vida Pessoal */
  .habito-card{background:var(--cor-superficie);border:1px solid var(--cor-borda);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;}
  .habito-topo{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .habito-nome{font-size:13.5px;font-weight:600;}
  .habito-semana{display:flex;gap:6px;}
  .habito-dia{width:28px;height:28px;border-radius:8px;background:var(--cor-fundo);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--cor-texto-suave);cursor:pointer;font-weight:600;}
  .habito-dia.feito{background:var(--cor-primaria);color:#fff;}

  .meta-pessoal{background:var(--cor-superficie);border:1px solid var(--cor-borda);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;}
  .meta-pessoal-topo{display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px;}
  .meta-pessoal-titulo{font-weight:600;}
  .meta-pessoal-prazo{color:var(--cor-texto-suave);font-size:11.5px;}

  .compra-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--cor-borda);font-size:13.5px;cursor:pointer;}
  .compra-item:last-child{border-bottom:none;}
  .compra-item.feito{color:var(--cor-texto-suave);text-decoration:line-through;}
  .compra-item input{accent-color:var(--cor-primaria);}
  .add-compra{display:flex;gap:8px;margin-top:14px;}
  .add-compra input{flex:1;border:1px solid var(--cor-borda);border-radius:8px;padding:9px 12px;font-size:12.5px;font-family:inherit;}
  .add-compra button{background:var(--cor-primaria);color:#fff;border-radius:8px;padding:9px 14px;font-size:12px;font-weight:600;}

  .devocional-card{background:var(--cor-superficie);border:1px solid var(--cor-borda);border-radius:var(--radius);padding:22px;}
  .devocional-data{font-size:11px;color:var(--cor-texto-suave);margin-bottom:8px;}
  .devocional-titulo{font-family:'Fraunces',serif;font-size:19px;margin-bottom:12px;}
  .devocional-texto{font-size:13.5px;line-height:1.7;color:var(--cor-texto);}

  /* Modulo Configuracoes */
  .config-tabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap;background:var(--cor-fundo);padding:4px;border-radius:10px;width:fit-content;}
  .config-tabs button{padding:8px 14px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--cor-texto-suave);}
  .config-tabs button.active{background:var(--cor-superficie);color:var(--cor-primaria);box-shadow:0 1px 3px rgba(0,0,0,.08);}

  .config-secao{background:var(--cor-superficie);border:1px solid var(--cor-borda);border-radius:var(--radius);padding:20px;margin-bottom:16px;}
  .config-secao h4{font-size:13px;font-weight:600;margin-bottom:14px;}
  .config-linha{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--cor-borda);gap:14px;flex-wrap:wrap;}
  .config-linha:last-child{border-bottom:none;}
  .config-linha-label{font-size:13px;}
  .config-linha-desc{font-size:11px;color:var(--cor-texto-suave);margin-top:2px;}

  .upload-area{
    border:1px dashed var(--cor-borda);border-radius:10px;padding:20px;text-align:center;
    font-size:12px;color:var(--cor-texto-suave);cursor:pointer;min-width:150px;
  }
  .upload-area:hover{background:var(--cor-fundo);}

  .cor-picker{display:flex;align-items:center;gap:10px;}
  .cor-swatch{width:32px;height:32px;border-radius:8px;border:1px solid var(--cor-borda);cursor:pointer;}
  .cor-picker input[type=color]{width:32px;height:32px;border:none;border-radius:8px;cursor:pointer;padding:0;}
  .cor-hex{font-size:12px;color:var(--cor-texto-suave);font-family:monospace;}

  .toggle{width:40px;height:22px;background:var(--cor-borda);border-radius:20px;position:relative;cursor:pointer;flex-shrink:0;}
  .toggle.on{background:var(--cor-primaria);}
  .toggle-bola{width:18px;height:18px;background:#fff;border-radius:50%;position:absolute;top:2px;left:2px;transition:left .15s;}
  .toggle.on .toggle-bola{left:20px;}

  .usuario-linha{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--cor-borda);}
  .usuario-linha:last-child{border-bottom:none;}
  .usuario-avatar{width:34px;height:34px;border-radius:50%;background:var(--cor-fundo);color:var(--cor-primaria);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;}
  .papel-pill{font-size:10.5px;font-weight:600;padding:2px 10px;border-radius:20px;background:var(--cor-fundo);color:var(--cor-texto-suave);margin-left:auto;}

  /* Central de notificacoes / automacoes */
  .status-conexao{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--cor-texto-suave);padding:0 4px;flex-shrink:0;}
  .status-conexao .bolinha{width:8px;height:8px;border-radius:50%;background:#3F6B4A;}
  .status-conexao.offline .bolinha{background:#B0413E;}
  .status-conexao.offline{color:#B0413E;font-weight:600;}
  @media (max-width:640px){ .status-conexao span.txt{display:none;} }

  .sino-wrap{position:relative;}
  .btn-sino{
    background:var(--cor-superficie);border:1px solid var(--cor-borda);border-radius:10px;
    padding:9px 11px;font-size:15px;position:relative;flex-shrink:0;
  }
  .sino-badge{
    position:absolute;top:-5px;right:-5px;background:var(--cor-primaria);color:#fff;
    font-size:9.5px;font-weight:700;min-width:16px;height:16px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;padding:0 3px;
  }
  .painel-notif{
    position:absolute;top:44px;right:0;width:300px;background:#fff;border:1px solid var(--cor-borda);
    border-radius:12px;box-shadow:0 16px 40px rgba(0,0,0,.15);z-index:55;overflow:hidden;display:none;
  }
  .painel-notif.aberto{display:block;}
  .painel-notif-topo{padding:12px 16px;border-bottom:1px solid var(--cor-borda);font-size:12.5px;font-weight:700;display:flex;justify-content:space-between;align-items:center;}
  .painel-notif-topo button{font-size:11px;color:var(--cor-texto-suave);font-weight:600;}
  .painel-notif-lista{max-height:320px;overflow-y:auto;}
  .notif-item{padding:11px 16px;border-bottom:1px solid var(--cor-borda);font-size:12px;}
  .notif-item:last-child{border-bottom:none;}
  .notif-item-titulo{font-weight:600;margin-bottom:2px;}
  .notif-item-hora{font-size:10px;color:var(--cor-texto-suave);}
  .painel-notif-vazio{padding:24px 16px;text-align:center;font-size:12px;color:var(--cor-texto-suave);}

  .toast-container{position:fixed;bottom:20px;right:20px;z-index:70;display:flex;flex-direction:column;gap:10px;}
  .toast{
    background:var(--cor-texto);color:#fff;padding:12px 16px;border-radius:10px;
    font-size:12.5px;max-width:300px;box-shadow:0 10px 30px rgba(0,0,0,.25);
    display:flex;gap:10px;align-items:flex-start;animation:toast-in .2s ease-out;
  }
  .toast .bolinha{width:7px;height:7px;border-radius:50%;background:var(--cor-acento);margin-top:5px;flex-shrink:0;}
  @keyframes toast-in{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  @media (max-width:640px){
    .painel-notif{right:-60px;width:260px;}
    .toast-container{left:12px;right:12px;bottom:80px;}
    .toast{max-width:none;}
  }

  .grafico-evolucao{display:flex;align-items:flex-end;gap:18px;height:160px;padding:10px 6px 0;}
  .grafico-barra-col{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;height:100%;justify-content:flex-end;}
  .grafico-barra{width:100%;max-width:44px;border-radius:6px 6px 0 0;position:relative;}
  .grafico-valor{font-size:11px;font-weight:700;}
  .grafico-data{font-size:10.5px;color:var(--cor-texto-suave);}

  /* Ciclo Menstrual */
  .ciclo-resumo{display:flex;gap:14px;margin-bottom:16px;flex-wrap:wrap;}
  .ciclo-card{flex:1;min-width:140px;background:var(--cor-superficie);border:1px solid var(--cor-borda);border-radius:var(--radius);padding:16px;}
  .ciclo-card .label{font-size:11px;color:var(--cor-texto-suave);margin-bottom:6px;}
  .ciclo-card .val{font-family:'Fraunces',serif;font-size:20px;}
  .ciclo-registro{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--cor-borda);font-size:13px;}
  .ciclo-registro:last-child{border-bottom:none;}

  .doc-status-valido{color:#3F6B4A;background:#E4EEE4;}
  .doc-status-vencendo{color:#8A6A1B;background:#F5EBD3;}
  .doc-status-vencido{color:#8E3A4A;background:#F6E1E5;}
  .doc-status-revisao{color:var(--cor-primaria);background:var(--cor-fundo);}
  .doc-status-pill{font-size:10px;font-weight:700;padding:2px 9px;border-radius:20px;white-space:nowrap;}
  .docrow{display:grid;grid-template-columns:1.6fr 1fr .8fr .8fr 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--cor-borda);font-size:12.5px;}
  .docrow:last-child{border-bottom:none;}
  .docrow-head{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--cor-texto-suave);font-weight:700;padding-bottom:6px;border-bottom:1px solid var(--cor-borda);}
  @media (max-width:640px){ .docrow, .docrow-head{grid-template-columns:1fr;} }

  /* Meu Ano em Pixels */
  .pixel-legenda{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:18px;}
  .pixel-mes{margin-bottom:18px;}
  .pixel-mes-nome{font-size:12px;font-weight:700;color:var(--cor-texto-suave);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em;}
  .pixel-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;max-width:260px;}
  .pixel-dia{aspect-ratio:1;border-radius:3px;background:var(--cor-borda);cursor:pointer;}
  .pixel-dia.vazio{visibility:hidden;}
  .pixel-tenso{background:#B0413E;}
  .pixel-bom{background:#8FA87A;}
  .pixel-produtivo{background:#C9A227;}
  .pixel-otimo{background:#5C2A38;}

  /* Modulo Ativos */
  .ativo-status-pill{font-size:10px;font-weight:700;padding:2px 9px;border-radius:20px;white-space:nowrap;}
  .status-desenvolvimento{background:#F5EBD3;color:#8A6A1B;}
  .status-ativo{background:#E4EEE4;color:#3F6B4A;}
  .status-revisao{background:var(--cor-fundo);color:var(--cor-primaria);}
  .status-arquivado{background:#EDEAE4;color:var(--cor-texto-suave);}

  /* Tela generica "em construcao" */
  .placeholder{
    background:var(--cor-superficie);border:1px dashed var(--cor-borda);border-radius:var(--radius);
    padding:60px 30px;text-align:center;color:var(--cor-texto-suave);
  }
  .placeholder .serif{font-size:20px;color:var(--cor-texto);margin-bottom:8px;}

  /* Busca global (modal) */
  .overlay{
    position:fixed;inset:0;background:rgba(34,32,29,.4);display:none;
    align-items:flex-start;justify-content:center;padding-top:12vh;z-index:50;
  }
  .overlay.aberto{display:flex;}
  .modal-busca{background:#fff;width:520px;max-width:92vw;border-radius:14px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.2);}
  .modal-busca input{
    width:100%;border:none;padding:18px 20px;font-size:15px;font-family:inherit;outline:none;border-bottom:1px solid var(--cor-borda);
  }
  .modal-busca .dica{padding:14px 20px;font-size:12px;color:var(--cor-texto-suave);}

  /* Bottom tab bar (mobile) */
  .tabbar{display:none;}

  @media (max-width:980px){
    .sidebar{display:none;}
    .menu-toggle{display:block;background:var(--cor-superficie);border:1px solid var(--cor-borda);border-radius:9px;padding:8px 10px;font-size:13px;}
    .grid{grid-template-columns:1fr 1fr;}
    .conteudo-full,.rapidos{grid-column:1/3;}
    main{padding:20px;padding-bottom:90px;}
    .tabbar{
      display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--cor-superficie);
      border-top:1px solid var(--cor-borda);padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:40;
    }
    .tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:var(--cor-texto-suave);padding:4px;border-radius:8px;}
    .tabbar button .ico{width:18px;height:18px;border-radius:5px;background:var(--cor-borda);}
    .tabbar button.active{color:var(--cor-primaria);font-weight:600;}
    .tabbar button.active .ico{background:var(--cor-primaria);}
  }
  @media (max-width:640px){
    .grid{grid-template-columns:1fr;}
    .conteudo-full,.rapidos{grid-column:1/2;}
    .search{width:150px;}
  }

  /* Sidebar off-canvas (mobile) */
  .sidebar-mobile-wrap{position:fixed;inset:0;z-index:60;display:none;}
  .sidebar-mobile-wrap.aberto{display:block;}
  .sidebar-mobile-wrap .backdrop{position:absolute;inset:0;background:rgba(34,32,29,.4);}
  .sidebar-mobile-wrap .sidebar{position:absolute;left:0;top:0;height:100%;box-shadow:0 0 40px rgba(0,0,0,.2);display:flex !important;}

  /* Tela de Login */
  #telaLogin{
    position:fixed;inset:0;background:var(--cor-fundo);z-index:100;
    display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .login-card{background:#fff;border-radius:18px;padding:36px 32px;width:360px;max-width:100%;box-shadow:0 20px 60px rgba(0,0,0,.12);}
  .login-marca{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:24px;}
  .login-marca .brand-mark{width:48px;height:48px;}
  .login-marca h1{font-family:'Fraunces',serif;font-size:19px;font-weight:600;}
  .login-marca p{font-size:11.5px;color:var(--cor-texto-suave);}
  .login-campo{margin-bottom:14px;}
  .login-campo label{display:block;font-size:11.5px;color:var(--cor-texto-suave);margin-bottom:5px;}
  .login-campo input{width:100%;border:1px solid var(--cor-borda);border-radius:9px;padding:11px 13px;font-size:13.5px;font-family:inherit;}
  .login-btn{width:100%;background:var(--cor-primaria);color:#fff;border-radius:10px;padding:12px;font-size:13.5px;font-weight:600;margin-top:6px;}
  .login-erro{color:#B0413E;font-size:12px;margin-top:8px;text-align:center;}
  .login-aviso{font-size:10.5px;color:var(--cor-texto-suave);text-align:center;margin-top:18px;line-height:1.5;}
  #appRoot{display:none;}
</style>
</head>

  const principais = TAB_PRINCIPAL[espacoAtual];

  let html = '';
  principais.forEach(id=>{

    html += `<button class="${telaAtual===id?'active':''}" onclick="irPara('${id}')"><span class="ico"></span>${it.nome}</button>`;
  });
  html += `<button onclick="abrirMenuMobile()"><span class="ico"></span>Mais</button>`;
  document.getElementById('tabbar').innerHTML = html;
}

function trocarEspaco(esp){
  espacoAtual = esp;
  document.body.setAttribute('data-espaco', esp);
  telaAtual = esp === 'trabalho' ? 'dashboard' : 'habitos';
  renderSidebar();
  renderTabbar();
  renderTela();
  fecharMenuMobile();

  telaAtual = id;

  fecharMenuMobile();
}

/* ---------- PLANNER SEMANAL (AGENDA) ---------- */
const DIAS_SEMANA = ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
const MESES_NOME = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const HORAS_PLANNER = Array.from({length:13}, (_,i)=> i+7); // 7h às 19h
const TIPOS_EVENTO = [
  {id:"visita", nome:"Visita", cor:"#8E5FB0"},
  {id:"demanda", nome:"Demanda", cor:"#D98B3F"},
  {id:"pessoal", nome:"Pessoal", cor:"#4F8A5E"},
  {id:"financeiro", nome:"Financeiro", cor:"#C9A227"},
];
const REF_DOMINGO = new Date(2026,7,2); // domingo, 2 de agosto de 2026 — âncora do "hoje" do protótipo

function addDias(data, n){ const d = new Date(data); d.setDate(d.getDate()+n); return d; }
function formatoISO(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function formatoBR(d){ return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0'); }
function inicioDaSemana(data){ const d = new Date(data); d.setDate(d.getDate()-d.getDay()); return d; }

let eventosSemana = [];
async function carregarEventosSupabase(){
  const { data, error } = await supa.from('eventos').select('*').order('data').order('hora');
  if(error){ dispararAutomacao('Erro ao carregar agenda', error.message); return; }
  eventosSemana = (data || []).map(row => ({
    id: row.id, dataISO: row.data, hora: row.hora, titulo: row.titulo, tipo: row.tipo, concluido: row.concluido
  }));
}
let celulaAtiva = null; // {dataISO, hora}
let corSelecionada = "visita";
let semanaOffsetAtual = 0;
let mesOffsetAtual = 0;
let visaoAgenda = "semana"; // 'semana' | 'mes'

function irSemana(delta){ semanaOffsetAtual += delta; renderTela(); }
function irSemanaHoje(){ semanaOffsetAtual = 0; renderTela(); }
function irMes(delta){ mesOffsetAtual += delta; renderTela(); }
function mudarVisaoAgenda(v){ visaoAgenda = v; renderTela(); }
function abrirSemanaDoDia(dataISO){
  const alvo = new Date(dataISO+'T00:00:00');
  const diffDias = Math.round((inicioDaSemana(alvo) - inicioDaSemana(REF_DOMINGO)) / 86400000);
  semanaOffsetAtual = Math.round(diffDias/7);
  visaoAgenda = 'semana';
  renderTela();
}

function agendaHTML(){
  const legenda = `<div class="legenda">` +
    TIPOS_EVENTO.map(t=>`<div class="legenda-item"><span class="legenda-dot dot-${t.id}"></span>${t.nome}</div>`).join('') +
    `</div>`;
  const abas = `<div class="etapa-tabs" style="margin:0 0 16px;">
      <button class="${visaoAgenda==='semana'?'active':''}" onclick="mudarVisaoAgenda('semana')">Semana</button>
      <button class="${visaoAgenda==='mes'?'active':''}" onclick="mudarVisaoAgenda('mes')">Mês / Calendário</button>
    </div>`;
  return legenda + abas + (visaoAgenda==='semana' ? agendaSemanaHTML() : agendaMesHTML());
}

function agendaSemanaHTML(){
  const domingo = addDias(inicioDaSemana(REF_DOMINGO), semanaOffsetAtual*7);
  const diasDaSemana = Array.from({length:7}, (_,i)=> addDias(domingo, i));
  const rotulo = formatoBR(diasDaSemana[0]) + ' – ' + formatoBR(diasDaSemana[6]) + '/' + diasDaSemana[6].getFullYear();

  let nav = `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px;">
      <div style="display:flex;gap:6px;align-items:center;">
        <button class="btn-secundario" onclick="irSemana(-1)">← Semana anterior</button>
        <button class="btn-secundario" onclick="irSemanaHoje()">Hoje</button>
        <button class="btn-secundario" onclick="irSemana(1)">Próxima semana →</button>
      </div>
      <div style="font-weight:600;font-size:13px;">${rotulo}</div>
    </div>`;

  let grid = `<div class="planner-scroll"><div class="planner-grid">`;
  grid += `<div class="canto"></div>`;
  diasDaSemana.forEach(d=>{
    const hoje = formatoISO(d)===formatoISO(REF_DOMINGO) ? ' style="color:var(--cor-primaria);"' : '';
    grid += `<div class="col-head"${hoje}>${DIAS_SEMANA[d.getDay()]}<span>${formatoBR(d)}</span></div>`;
  });

  HORAS_PLANNER.forEach(hora=>{
    grid += `<div class="planner-hora">${hora}h</div>`;
    diasDaSemana.forEach(d=>{
      const dataISO = formatoISO(d);
      const idCel = `cel-${dataISO}-${hora}`;
      const eventos = eventosSemana.filter(e=>e.dataISO===dataISO && e.hora===hora);
      let chips = eventos.map(e=>
        `<div class="evento-chip chip-${e.tipo} ${e.concluido?'concluido':''}" onclick="event.stopPropagation(); alternarConcluidoEvento('${e.id}')" title="Toque para marcar como feito">${e.titulo}<span onclick="event.stopPropagation(); removerEvento('${e.id}')" style="float:right;opacity:.7;padding-left:4px;" title="Remover">✕</span></div>`
      ).join('');
      let quickAdd = '';
      if(celulaAtiva && celulaAtiva.dataISO===dataISO && celulaAtiva.hora===hora){
        quickAdd = `
          <div class="quick-add" onclick="event.stopPropagation()">
            <input type="text" id="inputNovoEvento" placeholder="Título do evento" autofocus>
            <div class="cores">
              ${TIPOS_EVENTO.map(t=>`<div class="cor-op ${corSelecionada===t.id?'sel':''}" style="background:${t.cor}" onclick="selecionarCor('${t.id}')"></div>`).join('')}
            </div>
            <div class="acoes">
              <button class="btn-cancelar" onclick="celulaAtiva=null; renderTela()">Cancelar</button>
              <button class="btn-confirmar" onclick="confirmarNovoEvento('${dataISO}', ${hora})">Adicionar</button>
            </div>
          </div>`;
      }
      grid += `<div class="planner-cell" id="${idCel}" onclick="abrirQuickAdd('${dataISO}', ${hora})">${chips}${quickAdd}</div>`;
    });
  });
  grid += `</div></div>`;

  return `${nav}${grid}
    <div class="peq" style="margin-top:12px;font-size:12px;color:var(--cor-texto-suave);">
      Toque em qualquer horário vazio para adicionar rápido. Toque num evento pra riscar (marcar como feito) — toque no ✕ pra removê-lo de vez. Use as setas pra navegar pelas próximas semanas e já deixar compromissos marcados.
    </div>`;
}

function agendaMesHTML(){
  const baseMes = new Date(REF_DOMINGO.getFullYear(), REF_DOMINGO.getMonth()+mesOffsetAtual, 1);
  const nomeMes = MESES_NOME[baseMes.getMonth()] + ' de ' + baseMes.getFullYear();
  const primeiroDiaSemana = baseMes.getDay();
  const diasNoMes = new Date(baseMes.getFullYear(), baseMes.getMonth()+1, 0).getDate();

  let nav = `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
      <button class="btn-secundario" onclick="irMes(-1)">← Mês anterior</button>
      <div style="font-family:'Fraunces',serif;font-size:16px;">${nomeMes}</div>
      <button class="btn-secundario" onclick="irMes(1)">Próximo mês →</button>
    </div>`;

  let celulas = '';
  for(let i=0;i<primeiroDiaSemana;i++) celulas += `<div></div>`;
  for(let dia=1; dia<=diasNoMes; dia++){
    const dataCel = new Date(baseMes.getFullYear(), baseMes.getMonth(), dia);
    const dataISO = formatoISO(dataCel);
    const eventosNoDia = eventosSemana.filter(e=>e.dataISO===dataISO);
    const ehHoje = dataISO===formatoISO(REF_DOMINGO);
    const cores = [...new Set(eventosNoDia.map(e=>e.tipo))];
    celulas += `

  return `${nav}
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px;">

  renderTela();

  corSelecionada = tipo;
  renderTela();
  setTimeout(()=>{ const el = document.getElementById('inputNovoEvento'); if(el) el.focus(); }, 0);
}
async function confirmarNovoEvento(dataISO, hora){
  const input = document.getElementById('inputNovoEvento');
  const titulo = input ? input.value.trim() : '';
  if(!titulo){ input && input.focus(); return; }
  celulaAtiva = null;
  const { data, error } = await supa.from('eventos').insert({
    titulo, tipo: corSelecionada, data: dataISO, hora
  }).select().single();
  if(error){ dispararAutomacao('Erro ao criar evento', error.message); return; }
  eventosSemana.push({id: data.id, dataISO, hora, titulo, tipo: corSelecionada, concluido:false});
  const d = new Date(dataISO+'T00:00:00');
  dispararAutomacao('Lembrete criado', `"${titulo}" — ${DIAS_SEMANA[d.getDay()]} ${formatoBR(d)}, ${hora}h. Notificação agendada para 1h antes.`);
  renderTela();
}
async function alternarConcluidoEvento(id){
  const ev = eventosSemana.find(e=>e.id===id);
  ev.concluido = !ev.concluido;
  await supa.from('eventos').update({concluido: ev.concluido}).eq('id', id);
  renderTela();
}
async function removerEvento(id){
  eventosSemana = eventosSemana.filter(e=>e.id!==id);
  renderTela();
  await supa.from('eventos').delete().eq('id', id);
}

}
function novoDocumentoCliente(clienteId){
  const nome = prompt("Nome do documento (ex: Manual de Boas Práticas, Contrato, Licença...):");
  if(!nome || !nome.trim()) return;
  const tipo = prompt("Tipo (Manual, POP, MBP, Contrato, Licença, Certificado...):", "Documento") || "Documento";
  const validade = prompt("Data de validade (DD/MM/AAAA, ou deixe em branco se não tiver):", "") || "—";
  const revisao = prompt("Próxima revisão (DD/MM/AAAA, ou deixe em branco):", "") || "—";
  const status = prompt("Status (Válido / Vencendo / Vencido / Em revisão):", "Válido") || "Válido";
  const c = CLIENTES.find(x=>x.id===clienteId);
  if(!c.documentacao) c.documentacao = [];
  const novoId = (c.documentacao.reduce((m,d)=>Math.max(m,d.id),0)) + 1;
  c.documentacao.push({id:novoId, nome:nome.trim(), tipo, validade, revisao, status});
  dispararAutomacao('Documento adicionado ao checklist', `"${nome.trim()}" — ${c.nome}`);
  renderTela();
}

  const dataTxt = prompt("Data da visita (DD/MM/AAAA):", "");
  if(!dataTxt) return;
  const [dd,mm,aaaa] = dataTxt.split('/');
  if(!dd||!mm||!aaaa){ alert('Data inválida, use DD/MM/AAAA.'); return; }
  const dataISO = `${aaaa}-${mm.padStart(2,'0')}-${dd.padStart(2,'0')}`;
  const { data, error } = await supa.from('visitas').insert({
    cliente_id: clienteEscolhido.id,
    data: dataISO,
    status: 'agendada',
    nutricionista_nome: PERFIL_USUARIO.nome,
    nutricionista_crn: PERFIL_USUARIO.crn,
  }).select().single();
  if(error){
    dispararAutomacao('Erro ao agendar visita', error.message);
    return;
  }
  VISITAS.unshift({
    id: data.id, clienteId: clienteEscolhido.id, clienteNome: clienteEscolhido.nome,
    data: dataTxt, status:'agendada', mesAno: mesAnoPorData(dataISO),
    nutricionista: PERFIL_USUARIO.nome, crn: PERFIL_USUARIO.crn,
    preparo:[
      {id:1, texto:"Levar checklist BPF (tablet)", feito:true},
      {id:2, texto:"Confirmar horário com responsável no local", feito:false},
      {id:3, texto:"Revisar pendências da visita anterior", feito:false},
    ],
    checklist: gerarChecklistOficial(),
  });
  dispararAutomacao('Visita agendada', `${clienteEscolhido.nome} — ${dataTxt}`);
  renderTela();
}

    const semResposta = v.checklist.filter(i=>!i.resultado);

function calcularPontuacao(checklist){
  const sim = checklist.filter(i=>i.resultado==='conforme').length;
  const nao = checklist.filter(i=>i.resultado==='nao_conforme').length;
  const respondidos = sim + nao;
  if(respondidos===0) return 0;
  return Math.round((sim/respondidos)*100*10)/10;
}

function adicionarFotoItem(visitaId, itemId, inputEl){
  const arquivo = inputEl.files[0];
  if(!arquivo) return;
  const leitor = new FileReader();
  leitor.onload = function(e){
    const v = VISITAS.find(x=>x.id===visitaId);
    const item = v.checklist.find(i=>i.id===itemId);
    if(!item.fotos) item.fotos = [];
    item.fotos.push(e.target.result);
    dispararAutomacao('Foto anexada ao checklist', item.desc);
    renderTela();
  };
  leitor.readAsDataURL(arquivo);
}
function removerFotoItem(visitaId, itemId, idx){
  const v = VISITAS.find(x=>x.id===visitaId);
  const item = v.checklist.find(i=>i.id===itemId);
  item.fotos.splice(idx,1);
  renderTela();
}

async function marcarResultadoItem(visitaId, itemId, resultado){
  const v = VISITAS.find(x=>x.id===visitaId);
  const item = v.checklist.find(i=>i.id===itemId);
  const eraNaoConforme = item.resultado === 'nao_conforme';
  item.resultado = resultado;
  itensPendentesDestacar = itensPendentesDestacar.filter(id=>id!==itemId);
  renderTela();
  if(resultado === 'nao_conforme' && !eraNaoConforme){
    const cliente = CLIENTES.find(c=>c.id===v.clienteId);
    if(cliente){
      cliente.naoConformidades.push(item.desc + (item.obs ? ' — ' + item.obs : ''));
      cliente.pendencias.push('[BPF] Resolver: ' + item.desc);
      await supa.from('nao_conformidades').insert({
        cliente_id: cliente.id, visita_id: v.id, descricao: item.desc, observacao: item.obs || null
      });
      await supa.from('pendencias').insert({
        cliente_id: cliente.id, origem: 'checklist', titulo: 'Resolver: ' + item.desc, status: 'aberto'
      });
    }
    dispararAutomacao('Não conformidade gerada automaticamente', `"${item.desc}" — pendência criada na ficha de ${v.clienteNome}.`);

async function concluirVisita(id){
  const v = VISITAS.find(x=>x.id===id);
  v.status = 'concluida';
  v.pontuacao = calcularPontuacao(v.checklist);
  const naoConf = v.checklist.filter(i=>i.resultado==='nao_conforme').length;
  const hoje = new Date().toISOString().slice(0,10);

  const { error: erroUpdate } = await supa.from('visitas').update({
    status: 'concluida', pontuacao: v.pontuacao, data_aplicacao: hoje, data_elaboracao: hoje
  }).eq('id', v.id);

  const respostas = v.checklist.filter(i=>i.resultado).map(i=>({
    visita_id: v.id, item_modelo_id: i.id, resultado: i.resultado, observacao: i.obs || null
  }));
  let erroRespostas = null;
  if(respostas.length>0){
    const { error } = await supa.from('checklist_respostas_itens').insert(respostas);
    erroRespostas = error;
  }

  if(erroUpdate || erroRespostas){
    dispararAutomacao('Erro ao salvar visita', (erroUpdate||erroRespostas).message);
  }

  const cliente = CLIENTES.find(c=>c.id===v.clienteId);
  if(cliente){
    if(!cliente.historicoChecklist) cliente.historicoChecklist = [];
    cliente.historicoChecklist.push({data: v.data.slice(0,5), pontuacao: v.pontuacao});
  }
  dispararAutomacao(
    'Relatório em PDF gerado',
    `${v.clienteNome} — ${v.pontuacao}% de adequação, salvo no banco de dados.${naoConf>0 ? ' '+naoConf+' não conformidade(s) registrada(s).' : ''}`
  );
  voltarVisitas();
}

/* Assinatura via canvas — funciona com dedo ou caneta/stylus */
function inicializarAssinaturas(){
  ['assCliente','assTecnico'].forEach(idCanvas=>{
    const canvas = document.getElementById(idCanvas);
    if(!canvas || canvas.dataset.inicializado) return;
    canvas.dataset.inicializado = "1";
    const ctx = canvas.getContext('2d');
    ctx.strokeStyle = '#22201D';
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    let desenhando = false;
    const pos = (e)=>{
      const r = canvas.getBoundingClientRect();
      const cx = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
      const cy = (e.touches ? e.touches[0].clientY : e.clientY) - r.top;
      return {x: cx * (canvas.width/r.width), y: cy * (canvas.height/r.height)};
    };
    const iniciar = (e)=>{ desenhando = true; const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); };
    const mover = (e)=>{ if(!desenhando) return; const p = pos(e); ctx.lineTo(p.x,p.y); ctx.stroke(); e.preventDefault(); };
    const parar = ()=>{ desenhando = false; };
    canvas.addEventListener('mousedown', iniciar);
    canvas.addEventListener('mousemove', mover);
    window.addEventListener('mouseup', parar);
    canvas.addEventListener('touchstart', iniciar, {passive:true});
    canvas.addEventListener('touchmove', mover, {passive:false});
    canvas.addEventListener('touchend', parar);
  });
}
function limparAssinatura(idCanvas){
  const canvas = document.getElementById(idCanvas);
  canvas.getContext('2d').clearRect(0,0,canvas.width,canvas.height);
}

let LANCAMENTOS = [];

async function carregarLancamentosSupabase(){

  if(error){ dispararAutomacao('Erro ao carregar financeiro', error.message); return; }

    cliente: row.clientes ? row.clientes.nome : null,
    valor: parseFloat(row.valor), status: row.status,

  }));

function selecionarFiltroFinanceiro(f){ filtroFinanceiro = f; renderTela(); }
function formatarMoeda(v){ return "R$ " + v.toLocaleString('pt-BR', {minimumFractionDigits:2}); }

function vencimentoParaISO(vencTxt){
  if(!vencTxt || vencTxt==='—') return null;
  const partes = vencTxt.split('/');
  const dd = partes[0], mm = partes[1], aaaa = partes[2] || '2026';
  return `${aaaa}-${mm.padStart(2,'0')}-${dd.padStart(2,'0')}`;
}

async function novoLancamento(tipo){
  const desc = prompt(tipo==='receita' ? "Descrição da receita:" : "Descrição da despesa:");
  if(!desc || !desc.trim()) return;
  const valorTxt = prompt("Valor (só números, ex: 350):");
  const valor = parseFloat((valorTxt||'').replace(',','.'));
  if(!valor || valor<=0) return;
  const vencimento = prompt("Data de vencimento (DD/MM, ou deixe em branco):", "") || "";
  const { data, error } = await supa.from('lancamentos_financeiros').insert({
    tipo, descricao: desc.trim(), valor, vencimento: vencimentoParaISO(vencimento), status: 'aberto'
  }).select().single();
  if(error){ dispararAutomacao('Erro ao lançar', error.message); return; }
  LANCAMENTOS.push({id: data.id, tipo, desc: desc.trim(), cliente:null, valor, vencimento: vencimento||"—", vencimentoISO: data.vencimento, status:"aberto"});
  dispararAutomacao('Lançamento adicionado', `${tipo==='receita'?'Receita':'Despesa'}: ${desc.trim()} — ${formatarMoeda(valor)}`);
  renderTela();
}

function statusRealLancamento(l){
  if(l.status==='pago') return 'pago';
  if(!l.vencimento || l.vencimento==='—') return l.status;
  const [dd,mm] = l.vencimento.split('/').map(Number);
  if(!dd||!mm) return l.status;
  const dataVenc = new Date(2026, mm-1, dd);
  return dataVenc < REF_DOMINGO ? 'atrasado' : 'aberto';
}
async function darBaixaLancamento(id){
  const l = LANCAMENTOS.find(x=>x.id===id);
  const antecipado = confirm("Pagamento antecipado com desconto? OK = sim, Cancelar = não");
  let novoValor = l.valor;
  if(antecipado){
    const descTxt = prompt("Percentual de desconto (ex: 5 para 5%):", "5");
    const perc = parseFloat(descTxt);
    if(perc && perc>0){
      novoValor = Math.round(l.valor * (1 - perc/100) * 100)/100;
      dispararAutomacao('Baixa com desconto', `${l.desc} — de ${formatarMoeda(l.valor)} para ${formatarMoeda(novoValor)} (${perc}% de desconto por antecipação).`);
    }
  } else {
    dispararAutomacao('Pagamento recebido', `${l.desc} — ${formatarMoeda(l.valor)} baixado.`);
  }
  l.valor = novoValor; l.status = 'pago';
  await supa.from('lancamentos_financeiros').update({status:'pago', valor: novoValor}).eq('id', id);
  renderTela();
}

async function novoContratoParcelado(){
  if(CLIENTES.length===0){ alert('Cadastre um cliente antes de gerar um contrato.'); return; }
  const listaNomes = CLIENTES.map((c,i)=>`${i+1}. ${c.nome}`).join('\n');
  const escolha = prompt(`Qual cliente?\n${listaNomes}\n\nDigite o número:`);
  const idx = parseInt(escolha) - 1;
  if(isNaN(idx) || !CLIENTES[idx]) return;
  const clienteEscolhido = CLIENTES[idx];
  const valorTxt = prompt("Valor de cada parcela (ex: 650):");
  const valor = parseFloat((valorTxt||'').replace(',','.'));
  if(!valor || valor<=0) return;
  const qtdTxt = prompt("Quantidade de parcelas (ex: 12):", "12");
  const qtd = parseInt(qtdTxt) || 12;
  const diaTxt = prompt("Dia do vencimento todo mês (ex: 10):", "10");
  const diaVenc = parseInt(diaTxt) || 10;
  const mesInicialTxt = prompt("Mês/ano da 1ª parcela (MM/AAAA):", "08/2026");
  const [mesIni, anoIni] = (mesInicialTxt||'08/2026').split('/').map(Number);

  const novasParcelas = [];
  for(let i=0;i<qtd;i++){
    const dataP = new Date(anoIni, (mesIni-1)+i, diaVenc);
    const vencISO = dataP.toISOString().slice(0,10);
    novasParcelas.push({
      tipo:"receita", descricao:`Contrato — ${clienteEscolhido.nome} (${i+1}/${qtd})`,
      cliente_id: clienteEscolhido.id, valor, vencimento: vencISO, status:"aberto"
    });
  }
  const { data, error } = await supa.from('lancamentos_financeiros').insert(novasParcelas).select();
  if(error){ dispararAutomacao('Erro ao gerar contrato', error.message); return; }
  data.forEach(row=>{
    LANCAMENTOS.push({
      id: row.id, tipo:"receita", desc: row.descricao, cliente: clienteEscolhido.nome,
      valor, vencimento: row.vencimento.split('-').reverse().slice(0,2).join('/'), vencimentoISO: row.vencimento, status:"aberto"
    });
  });
  dispararAutomacao('Contrato parcelado gerado', `${qtd}x ${formatarMoeda(valor)} — ${clienteEscolhido.nome}, vencendo todo dia ${diaVenc}.`);
  renderTela();
}

async function novoLead(){
  const nome = prompt("Nome do lead/empresa:");
  if(!nome || !nome.trim()) return;
  const valorTxt = prompt("Valor estimado (ex: 1500):", "");
  const valor = parseFloat((valorTxt||'0').replace(',','.')) || 0;
  const origem = prompt("Origem (Indicação, Instagram, Site...):", "Indicação") || "—";
  const { data, error } = await supa.from('leads').insert({
    nome: nome.trim(), valor_estimado: valor, origem, etapa: 'novo'
  }).select().single();
  if(error){ dispararAutomacao('Erro ao cadastrar lead', error.message); return; }
  LEADS.push({id: data.id, nome: nome.trim(), valor, etapa:'novo', origem});
  dispararAutomacao('Lead cadastrado', nome.trim());
  renderTela();
}

async function moverLead(id, direcao){
  const idxAtual = ETAPAS_PIPELINE.findIndex(e=>e.id===LEADS.find(l=>l.id===id).etapa);
  const novoIdx = idxAtual + direcao;
  if(novoIdx<0 || novoIdx>=ETAPAS_PIPELINE.length) return;
  const lead = LEADS.find(l=>l.id===id);
  lead.etapa = ETAPAS_PIPELINE[novoIdx].id;
  await supa.from('leads').update({etapa: lead.etapa}).eq('id', id);
  renderTela();
  if(lead.etapa === 'fechado'){
    const { data, error } = await supa.from('clientes').insert({
      nome: lead.nome, responsavel: PERFIL_USUARIO.nome,
      inicio: new Date().toLocaleDateString('pt-BR',{month:'short',year:'numeric'}),
    }).select().single();
    if(!error){
      CLIENTES.push(linhaParaCliente(data));
      dispararAutomacao('Cliente criado automaticamente', `"${lead.nome}" fechou negócio e já virou cliente de verdade. Agende a 1ª visita na Agenda.`);
    }
  }
}

function alternarChecklistProjeto(projId, etapaId, idx){
  const p = PROJETOS.find(x=>x.id===projId);
  const et = p.etapas.find(e=>e.id===etapaId);
  et.checklist[idx].c = !et.checklist[idx].c;
  const todosFeitos = et.checklist.every(i=>i.c);
  if(todosFeitos && et.checklist.length>0){
    dispararAutomacao('Etapa de projeto concluída', `"${et.nome}" — ${p.nome}. Progresso do projeto atualizado.`);
  }
  renderTela();
}

function progressoEtapa(etapa){
  const total = etapa.checklist.length;
  const feitos = etapa.checklist.filter(i=>i.c).length;
  if(total===0) return 0;
  return feitos/total;
}
function statusEtapa(etapa){
  const p = progressoEtapa(etapa);
  if(p===1) return 'concluida';
  if(p===0) return 'pendente';
  return 'andamento';
}
function progressoProjeto(projeto){
  const totalItens = projeto.etapas.reduce((s,e)=>s+e.checklist.length,0);
  const feitos = projeto.etapas.reduce((s,e)=>s+e.checklist.filter(i=>i.c).length,0);
  return totalItens===0 ? 0 : Math.round((feitos/totalItens)*100);
}

const DIAS_CURTO = ["D","S","T","Q","Q","S","S"];

let HABITOS = [];
async function carregarHabitosSupabase(){
  const { data: { user } } = await supa.auth.getUser();
  const { data: habitosRows, error } = await supa.from('habitos').select('*').eq('user_id', user.id).order('id');
  if(error){ dispararAutomacao('Erro ao carregar hábitos', error.message); return; }
  const domingo = inicioDaSemana(REF_DOMINGO);
  const datasSemana = Array.from({length:7}, (_,i)=> formatoISO(addDias(domingo,i)));
  const { data: registros } = await supa.from('habito_registros').select('*').in('data', datasSemana);
  HABITOS = (habitosRows||[]).map(h=>({
    id: h.id, nome: h.nome,
    semana: datasSemana.map(d => (registros||[]).some(r=>r.habito_id===h.id && r.data===d && r.concluido))
  }));
}
async function alternarHabitoDia(id, idx){
  const h = HABITOS.find(x=>x.id===id);
  h.semana[idx] = !h.semana[idx];
  renderTela();
  const domingo = inicioDaSemana(REF_DOMINGO);
  const dataISO = formatoISO(addDias(domingo, idx));
  const { data: existente } = await supa.from('habito_registros').select('id').eq('habito_id', id).eq('data', dataISO).maybeSingle();
  if(existente){
    await supa.from('habito_registros').update({concluido: h.semana[idx]}).eq('id', existente.id);
  } else {
    await supa.from('habito_registros').insert({habito_id: id, data: dataISO, concluido: h.semana[idx]});
  }
}
async function novoHabito(){
  const nome = prompt("Nome do novo hábito:");
  if(!nome || !nome.trim()) return;
  const { data: { user } } = await supa.auth.getUser();
  const { data, error } = await supa.from('habitos').insert({user_id: user.id, nome: nome.trim()}).select().single();
  if(error){ dispararAutomacao('Erro ao criar hábito', error.message); return; }
  HABITOS.push({id: data.id, nome: nome.trim(), semana:[false,false,false,false,false,false,false]});
  dispararAutomacao('Hábito criado', `"${nome.trim()}" adicionado ao seu acompanhamento semanal.`);
  renderTela();
}
function habitosHTML(){
  return `
    <div style="margin-bottom:14px;"><button class="btn-primario" onclick="novoHabito()">+ Novo hábito</button></div>
    ${HABITOS.map(h=>`
    <div class="habito-card">
      <div class="habito-topo">
        <div class="habito-nome">${h.nome}</div>
        <div class="peq" style="font-size:11px;color:var(--cor-texto-suave);">${h.semana.filter(Boolean).length}/7 dias</div>
      </div>
      <div class="habito-semana">
        ${h.semana.map((f,idx)=>`<div class="habito-dia ${f?'feito':''}" onclick="alternarHabitoDia('${h.id}',${idx})">${DIAS_CURTO[idx]}</div>`).join('')}
      </div>
    </div>
  `).join('')}`;
}

/* ---------- MOTOR DE AUTOMAÇÕES (Fase 7) ---------- */
let LOG_AUTOMACOES = [];
let notifNaoLidas = 0;

function dispararAutomacao(titulo, detalhe){
  const agora = new Date();
  const hora = agora.getHours().toString().padStart(2,'0')+':'+agora.getMinutes().toString().padStart(2,'0');
  LOG_AUTOMACOES.unshift({titulo, detalhe, hora});
  notifNaoLidas++;
  mostrarToast(titulo);
  atualizarBadgeNotif();
  if(document.getElementById('painelNotif').classList.contains('aberto')){
    renderPainelNotif();
  }

/* ---------- CICLO MENSTRUAL ---------- */
let REGISTROS_CICLO = [];
async function carregarCicloSupabase(){
  const { data: { user } } = await supa.auth.getUser();
  const { data, error } = await supa.from('registros_ciclo').select('*').eq('user_id', user.id).order('data', {ascending:false});
  if(error){ dispararAutomacao('Erro ao carregar ciclo', error.message); return; }
  REGISTROS_CICLO = (data||[]).map(r=>({id:r.id, data: r.data.split('-').reverse().slice(0,2).join('/')}));
}
function calcularMediaCiclo(){
  if(REGISTROS_CICLO.length < 2) return null;
  const datas = REGISTROS_CICLO.map(r=>{
    const [d,m] = r.data.split('/').map(Number);
    return new Date(2026, m-1, d);
  }).sort((a,b)=>b-a);
  let diffs = [];
  for(let i=0;i<datas.length-1;i++){
    diffs.push(Math.round((datas[i]-datas[i+1])/(1000*60*60*24)));
  }
  return Math.round(diffs.reduce((a,b)=>a+b,0)/diffs.length);
}
async function registrarInicioCiclo(){
  const dataTxt = prompt("Data de início (formato DD/MM):", "");
  if(!dataTxt || !dataTxt.trim()) return;
  const [dd,mm] = dataTxt.trim().split('/');
  if(!dd||!mm){ alert('Use o formato DD/MM.'); return; }
  const dataISO = `2026-${mm.padStart(2,'0')}-${dd.padStart(2,'0')}`;
  const { data: { user } } = await supa.auth.getUser();
  const { data, error } = await supa.from('registros_ciclo').insert({user_id:user.id, data:dataISO}).select().single();
  if(error){ dispararAutomacao('Erro ao registrar ciclo', error.message); return; }
  REGISTROS_CICLO.unshift({id: data.id, data: dataTxt.trim()});
  dispararAutomacao('Ciclo registrado', `Início registrado em ${dataTxt.trim()}.`);
  renderTela();
}
function cicloHTML(){
  const media = calcularMediaCiclo();
  const ultima = REGISTROS_CICLO[0];
  return `
    <div class="ciclo-resumo">
      <div class="ciclo-card"><div class="label">Último início registrado</div><div class="val">${ultima ? ultima.data : '—'}</div></div>
      <div class="ciclo-card"><div class="label">Duração média do ciclo</div><div class="val">${media ? media+' dias' : '—'}</div></div>
    </div>
    <div style="margin-bottom:14px;"><button class="btn-primario" onclick="registrarInicioCiclo()">+ Registrar início</button></div>
    <div class="aba-conteudo">
      <h4 style="margin-bottom:6px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--cor-texto-suave);">Histórico</h4>
      ${REGISTROS_CICLO.length ? REGISTROS_CICLO.map(r=>`<div class="ciclo-registro"><span>Início do ciclo</span><span>${r.data}</span></div>`).join('') : semRegistro()}

}

/* ---------- MEU ANO EM PIXELS ---------- */
const HUMORES_PIXEL = [
  {id:"tenso", nome:"Tenso", classe:"pixel-tenso"},
  {id:"bom", nome:"Bom", classe:"pixel-bom"},
  {id:"produtivo", nome:"Produtivo", classe:"pixel-produtivo"},
  {id:"otimo", nome:"Ótimo", classe:"pixel-otimo"},
];
let REGISTROS_PIXEL = {}; // chave: "2026-08-02" -> "tenso"|"bom"|"produtivo"|"otimo"
async function carregarPixelSupabase(){
  const { data: { user } } = await supa.auth.getUser();
  const { data, error } = await supa.from('registros_pixel').select('*').eq('user_id', user.id);
  if(error){ dispararAutomacao('Erro ao carregar Ano em Pixels', error.message); return; }
  REGISTROS_PIXEL = {};
  (data||[]).forEach(r=>{ REGISTROS_PIXEL[r.data] = r.humor; });
}

async function marcarPixelDia(dataISO){
  const atual = REGISTROS_PIXEL[dataISO];
  const idx = HUMORES_PIXEL.findIndex(h=>h.id===atual);
  const proximo = idx === -1 ? 0 : (idx+1 < HUMORES_PIXEL.length ? idx+1 : -1);
  const { data: { user } } = await supa.auth.getUser();
  if(proximo === -1){
    delete REGISTROS_PIXEL[dataISO];
    renderTela();
    await supa.from('registros_pixel').delete().eq('user_id', user.id).eq('data', dataISO);
  } else {
    REGISTROS_PIXEL[dataISO] = HUMORES_PIXEL[proximo].id;
    renderTela();
    await supa.from('registros_pixel').upsert({user_id:user.id, data:dataISO, humor:HUMORES_PIXEL[proximo].id}, {onConflict:'user_id,data'});
  }
}

function anoPixelsHTML(){
  const ano = REF_DOMINGO.getFullYear();
  let legenda = `<div class="pixel-legenda">` +
    HUMORES_PIXEL.map(h=>`<div class="legenda-item"><span class="legenda-dot ${h.classe}"></span>${h.nome}</div>`).join('') +
    `<div class="legenda-item"><span class="legenda-dot" style="background:var(--cor-borda);"></span>Sem registro</div></div>`;

  let meses = '';
  for(let m=0; m<12; m++){
    const diasNoMes = new Date(ano, m+1, 0).getDate();
    const primeiroDiaSemana = new Date(ano, m, 1).getDay();
    let celulas = '';
    for(let i=0;i<primeiroDiaSemana;i++) celulas += `<div class="pixel-dia vazio"></div>`;
    for(let d=1; d<=diasNoMes; d++){
      const dataISO = ano+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
      const humor = REGISTROS_PIXEL[dataISO];
      const classeCor = humor ? HUMORES_PIXEL.find(h=>h.id===humor).classe : '';
      celulas += `<div class="pixel-dia ${classeCor}" title="${d}/${m+1}" onclick="marcarPixelDia('${dataISO}')"></div>`;
    }
    meses += `<div class="pixel-mes"><div class="pixel-mes-nome">${MESES_NOME[m]}</div><div class="pixel-grid">${celulas}</div></div>`;
  }

  return `${legenda}<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px;">${meses}</div>
    <div style="margin-top:10px;font-size:11.5px;color:var(--cor-texto-suave);">Toque num dia pra ir passando pelos humores (Tenso → Bom → Produtivo → Ótimo → sem registro). Ano de ${ano}.</div>`;
}

/* ---------- PERSISTÊNCIA (salvar de verdade — Clientes, Agenda, Visitas e Financeiro) ---------- */
const CHAVE_ESTADO = 'meu-ecossistema-estado-v1';
let armazenamentoDisponivel = false;

async function carregarEstado(){
  try{
    if(!window.storage) return;
    const r = await window.storage.get(CHAVE_ESTADO);
    armazenamentoDisponivel = true;
    if(r && r.value){
      const d = JSON.parse(r.value);
      if(d.CLIENTES) CLIENTES.splice(0, CLIENTES.length, ...d.CLIENTES);
      if(d.eventosSemana) eventosSemana = d.eventosSemana;
      if(d.VISITAS) VISITAS.splice(0, VISITAS.length, ...d.VISITAS);
      if(d.LANCAMENTOS) LANCAMENTOS.splice(0, LANCAMENTOS.length, ...d.LANCAMENTOS);
      if(d.proximoIdEvento) proximoIdEvento = d.proximoIdEvento;
      if(d.PENDENCIAS_MANUAIS) PENDENCIAS_MANUAIS = d.PENDENCIAS_MANUAIS;
      if(d.proximoIdPendManual) proximoIdPendManual = d.proximoIdPendManual;
      if(d.proximoIdCliente) proximoIdCliente = d.proximoIdCliente;
      if(d.proximoIdLancamento) proximoIdLancamento = d.proximoIdLancamento;
      if(d.REGISTROS_PIXEL) REGISTROS_PIXEL = d.REGISTROS_PIXEL;
      if(d.ATIVOS) ATIVOS.splice(0, ATIVOS.length, ...d.ATIVOS);
      if(d.proximoIdAtivo) proximoIdAtivo = d.proximoIdAtivo;
      if(d.PERFIL_USUARIO) Object.assign(PERFIL_USUARIO, d.PERFIL_USUARIO);
    }
  } catch(e){
    // Ainda não há dados salvos, ou o app está sendo aberto fora do ambiente de artefatos do Claude
    // (ex: arquivo baixado e aberto direto no navegador) — nesse caso funciona só como demonstração.
    armazenamentoDisponivel = !!window.storage;
  }
}

async function salvarEstado(){
  registrarAcaoOffline('Alteração de dados');
  try{
    if(!window.storage) return;
    const d = { CLIENTES, eventosSemana, VISITAS, LANCAMENTOS, proximoIdEvento, PENDENCIAS_MANUAIS, proximoIdPendManual, proximoIdCliente, proximoIdLancamento, REGISTROS_PIXEL, ATIVOS, proximoIdAtivo, PERFIL_USUARIO };
    await window.storage.set(CHAVE_ESTADO, JSON.stringify(d));
  } catch(e){ /* silencioso — não interrompe o uso do app */ }
}

function avisoPersistencia(){
  if(!armazenamentoDisponivel){
    dispararAutomacao('Modo demonstração', 'Abra este app pelo link do Claude (não pelo arquivo baixado) para os dados de Clientes, Agenda e Financeiro serem salvos de verdade entre uma sessão e outra.');
  }
}

/* ---------- MODO OFFLINE INTELIGENTE ---------- */
let filaAcoesOffline = [];

function atualizarStatusConexao(){
  const el = document.getElementById('statusConexao');
  if(!el) return;
  if(navigator.onLine){
    el.classList.remove('offline');
    el.querySelector('.txt').innerText = 'Online';
  } else {
    el.classList.add('offline');
    el.querySelector('.txt').innerText = 'Offline';
  }
}
window.addEventListener('online', ()=>{
  atualizarStatusConexao();
  if(filaAcoesOffline.length>0){
    dispararAutomacao('Conexão restabelecida', `${filaAcoesOffline.length} ação(ões) feita(s) offline foram sincronizadas agora.`);
    filaAcoesOffline = [];
  } else {
    dispararAutomacao('Conexão restabelecida', 'Você está online novamente.');
  }
  salvarEstado();
});
window.addEventListener('offline', ()=>{
  atualizarStatusConexao();
  dispararAutomacao('Você está offline', 'Continue usando normalmente — o que você fizer aqui na visita fica guardado no aparelho e sincroniza sozinho assim que a internet voltar.');
});
function registrarAcaoOffline(descricao){
  if(!navigator.onLine){
    filaAcoesOffline.push({descricao, quando: new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})});
  }
}
