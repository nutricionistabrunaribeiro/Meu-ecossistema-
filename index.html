const ETAPAS_PIPELINE = [
  {id:"novo", nome:"Novo"},
  {id:"contato", nome:"Contato"},
  {id:"proposta", nome:"Proposta"},
  {id:"followup", nome:"Follow-up"},
  {id:"fechado", nome:"Fechado"},
];
let LEADS = [];

async function carregarLeadsSupabase(){
  const { data, error } = await supa.from('leads').select('*').order('criado_em');
  if(error){ dispararAutomacao('Erro ao carregar leads', error.message); return; }
  LEADS = (data || []).map(row => ({
    id: row.id, nome: row.nome, valor: parseFloat(row.valor_estimado)||0, etapa: row.etapa, origem: row.origem||"—"
  }));
}
async function novoLead(){
  const nome = prompt("Nome do lead/empresa:");
  if(!nome || !nome.trim()) return;
  const valorTxt = prompt("Valor estimado (ex: 1500):", "");
  const valor = parseFloat((valorTxt||'0').replace(',','.')) || 0;
  const origem = prompt("Origem (Indicação, Instagram, Site...):", "Indicação") || "—";
  const { data, error } = await supa.from('leads').insert({
    nome: nome.trim(), valor_estimado: valor, origem, etapa: 'novo'
  }).select().single();
  if(error){ dispararAutomacao('Erro ao cadastrar lead', error.message); return; }
  LEADS.push({id: data.id, nome: nome.trim(), valor, etapa:'novo', origem});
  dispararAutomacao('Lead cadastrado', nome.trim());
  renderTela();
}

async function moverLead(id, direcao){
  const idxAtual = ETAPAS_PIPELINE.findIndex(e=>e.id===LEADS.find(l=>l.id===id).etapa);
  const novoIdx = idxAtual + direcao;
  if(novoIdx<0 || novoIdx>=ETAPAS_PIPELINE.length) return;
  const lead = LEADS.find(l=>l.id===id);
  lead.etapa = ETAPAS_PIPELINE[novoIdx].id;
  await supa.from('leads').update({etapa: lead.etapa}).eq('id', id);
  renderTela();
  if(lead.etapa === 'fechado'){
    const { data, error } = await supa.from('clientes').insert({
      nome: lead.nome, responsavel: PERFIL_USUARIO.nome,
      inicio: new Date().toLocaleDateString('pt-BR',{month:'short',year:'numeric'}),
    }).select().single();
    if(!error){
      CLIENTES.push(linhaParaCliente(data));
      dispararAutomacao('Cliente criado automaticamente', `"${lead.nome}" fechou negócio e já virou cliente de verdade. Agende a 1ª visita na Agenda.`);
    }
  }
}
async function excluirLead(id){
  const lead=LEADS.find(l=>l.id===id);
  if(!lead || !confirm(`Excluir "${lead.nome}" do pipeline comercial?`)) return;
  const {error}=await supa.from('leads').delete().eq('id',id);
  if(error){dispararAutomacao('Erro ao excluir contato',error.message);return;}
  LEADS=LEADS.filter(l=>l.id!==id);
  dispararAutomacao('Contato excluído do pipeline',lead.nome);
  renderTela();
}

function comercialHTML(){
  return `

async function carregarProjetosSupabase(){
  const { data: projetosRows, error } = await supa.from('projetos').select('*, clientes(nome)').order('criado_em');
  if(error){ dispararAutomacao('Erro ao carregar projetos', error.message); return; }
  const { data: etapasRows } = await supa.from('etapas_projeto').select('*').order('ordem');
  const { data: checklistRows } = await supa.from('checklist_etapa_projeto').select('*');
  PROJETOS = (projetosRows||[]).map(p=>({
    id: p.id, nome: p.nome, clienteId:p.cliente_id, cliente: p.clientes ? p.clientes.nome : "—",
    etapas: (etapasRows||[]).filter(e=>e.projeto_id===p.id).map(e=>({
      id: e.id, nome: e.nome, ordem:e.ordem,
      checklist: (checklistRows||[]).filter(c=>c.etapa_id===e.id).map(c=>({id:c.id, t:c.item, c:c.concluido}))
    }))

async function novoProjeto(clienteId=null){
  if(CLIENTES.length===0){ alert('Cadastre um cliente antes de criar um projeto.'); return; }
  let clienteEscolhido = clienteId ? CLIENTES.find(c=>c.id===clienteId) : null;
  if(!clienteEscolhido){
    const listaNomes = CLIENTES.map((c,i)=>`${i+1}. ${c.nome}`).join('\n');
    const escolha = prompt(`Qual cliente?\n${listaNomes}\n\nDigite o número:`);
    const idx = parseInt(escolha) - 1;
    if(isNaN(idx) || !CLIENTES[idx]) return;
    clienteEscolhido = CLIENTES[idx];
  }
  const nome = prompt("Nome do projeto:");
  if(!nome || !nome.trim()) return;
  const { data, error } = await supa.from('projetos').insert({nome: nome.trim(), cliente_id: clienteEscolhido.id}).select().single();
  if(error){ dispararAutomacao('Erro ao criar projeto', error.message); return; }
  const etapasPayload = ETAPAS_PADRAO_PROJETO.map((et,idx)=>({projeto_id:data.id, nome:et.nome, ordem:idx+1}));
  const { data: etapasCriadas, error: erroEtapas } = await supa.from('etapas_projeto').insert(etapasPayload).select();
  if(erroEtapas){
    await supa.from('projetos').delete().eq('id', data.id);
    dispararAutomacao('Erro ao criar etapas do projeto', erroEtapas.message);
    return;
  }
  const itensPayload = etapasCriadas.flatMap(etapa=>{
    const modelo = ETAPAS_PADRAO_PROJETO.find(x=>x.nome===etapa.nome);
    return (modelo?.itens || []).map(item=>({etapa_id:etapa.id, item, concluido:false}));
  });
  const { data: itensCriados, error: erroItens } = await supa.from('checklist_etapa_projeto').insert(itensPayload).select();
  if(erroItens){
    await supa.from('projetos').delete().eq('id', data.id);
    dispararAutomacao('Erro ao criar checklist do projeto', erroItens.message);
    return;
  }
  const etapasTela = etapasCriadas.map(et=>({
    id:et.id, nome:et.nome,
    checklist:(itensCriados||[]).filter(i=>i.etapa_id===et.id).map(i=>({id:i.id,t:i.item,c:i.concluido}))
  }));
  PROJETOS.push({id: data.id, nome: nome.trim(), clienteId:clienteEscolhido.id, cliente: clienteEscolhido.nome, etapas: etapasTela});
  dispararAutomacao('Projeto criado', nome.trim());
  renderTela();
}

async function alternarChecklistProjeto(projId, etapaId, idx){
  const p = PROJETOS.find(x=>x.id===projId);
  const et = p.etapas.find(e=>e.id===etapaId);
  et.checklist[idx].c = !et.checklist[idx].c;
  const todosFeitos = et.checklist.every(i=>i.c);
  if(todosFeitos && et.checklist.length>0){
    dispararAutomacao('Etapa de projeto concluída', `"${et.nome}" — ${p.nome}. Progresso do projeto atualizado.`);
  }
  renderTela();
  await supa.from('checklist_etapa_projeto').update({concluido: et.checklist[idx].c}).eq('id', et.checklist[idx].id);
}
async function adicionarEtapaProjeto(projId){
  const p=PROJETOS.find(x=>x.id===projId);if(!p)return;
  const nome=prompt('Nome da nova etapa:');if(!nome?.trim())return;

  if(error){dispararAutomacao('Erro ao adicionar etapa',error.message);return;}

}

async function excluirItemProjeto(projId,etapaId,itemId){

async function excluirEtapaProjeto(projId,etapaId){
  const p=PROJETOS.find(x=>x.id===projId);const et=p?.etapas.find(e=>e.id===etapaId);
  if(!et||!confirm(`Excluir a etapa "${et.nome}" e os itens dela?`))return;
  const {error}=await supa.from('etapas_projeto').delete().eq('id',etapaId);if(error){dispararAutomacao('Erro ao excluir etapa',error.message);return;}
  p.etapas=p.etapas.filter(e=>e.id!==etapaId);renderTela();
}

function progressoEtapa(etapa){
  const total = etapa.checklist.length;
  const feitos = etapa.checklist.filter(i=>i.c).length;
  if(total===0) return 0;
  return feitos/total;
}
function statusEtapa(etapa){
  const p = progressoEtapa(etapa);
  if(p===1) return 'concluida';
  if(p===0) return 'pendente';
  return 'andamento';
}
function progressoProjeto(projeto){
  const totalItens = projeto.etapas.reduce((s,e)=>s+e.checklist.length,0);
  const feitos = projeto.etapas.reduce((s,e)=>s+e.checklist.filter(i=>i.c).length,0);
  return totalItens===0 ? 0 : Math.round((feitos/totalItens)*100);
}

const STATUS_MKT = [
  {id:"ideia", nome:"Ideia"},
  {id:"producao", nome:"Produção"},
  {id:"agendado", nome:"Agendado"},
  {id:"publicado", nome:"Publicado"},
];
let CONTEUDOS_MKT = [];
let BANCO_IDEIAS = [];
async function carregarMarketingSupabase(){
  const { data: conteudos, error: e1 } = await supa.from('conteudos_marketing').select('*').order('data_publicacao');
  if(e1){ dispararAutomacao('Erro ao carregar marketing', e1.message); }
  CONTEUDOS_MKT = (conteudos||[]).map(c=>({
    id:c.id, tipo:c.tipo, titulo:c.titulo, status:c.status,
    dataISO: c.data_publicacao || null,
    data: c.data_publicacao ? c.data_publicacao.split('-').reverse().slice(0,2).join('/') : "—"
  }));
  const { data: ideias, error: e2 } = await supa.from('banco_ideias_marketing').select('*').order('id',{ascending:false});
  if(e2){ dispararAutomacao('Erro ao carregar banco de ideias', e2.message); }
  BANCO_IDEIAS = (ideias||[]).map(i=>({id:i.id, titulo:i.titulo, tags:i.tags||"—"}));
}
async function editarConteudoMarketing(id){
  const c = CONTEUDOS_MKT.find(x=>x.id===id);
  if(!c) return;
  const titulo = prompt('Título do conteúdo:', c.titulo);
  if(titulo===null || !titulo.trim()) return;
  const tipo = prompt('Tipo (Reels, Story, Feed...):', c.tipo);
  if(tipo===null || !tipo.trim()) return;
  const dataTxt = prompt('Data de publicação (DD/MM, deixe vazio para remover):', c.data==='—'?'':c.data);
  if(dataTxt===null) return;
  const status = prompt('Status (ideia, producao, agendado ou publicado):', c.status);
  if(status===null || !STATUS_MKT.some(s=>s.id===status.trim())){ alert('Status inválido.'); return; }
  const dataISO = dataTxt.trim() ? vencimentoParaISO(dataTxt.trim()) : null;
  const atualizacao = {titulo:titulo.trim(), tipo:tipo.trim(), data_publicacao:dataISO, status:status.trim()};
  const { error } = await supa.from('conteudos_marketing').update(atualizacao).eq('id', id);
  if(error){ dispararAutomacao('Erro ao editar conteúdo', error.message); return; }
  Object.assign(c, {titulo:atualizacao.titulo, tipo:atualizacao.tipo, status:atualizacao.status, dataISO, data:dataTxt.trim()||'—'});
  dispararAutomacao('Conteúdo atualizado', c.titulo);
  renderTela();
}
async function excluirConteudoMarketing(id){
  const c = CONTEUDOS_MKT.find(x=>x.id===id);
  if(!c || !confirm(`Excluir o conteúdo "${c.titulo}"?`)) return;
  const { error } = await supa.from('conteudos_marketing').delete().eq('id', id);
  if(error){ dispararAutomacao('Erro ao excluir conteúdo', error.message); return; }

const DIAS_CURTO = ["D","S","T","Q","Q","S","S"];

let HABITOS = [];
async function carregarHabitosSupabase(){
  const { data: { user } } = await supa.auth.getUser();
  const { data: habitosRows, error } = await supa.from('habitos').select('*').eq('user_id', user.id).order('id');
  if(error){ dispararAutomacao('Erro ao carregar hábitos', error.message); return; }
  const domingo = inicioDaSemana(REF_DOMINGO);
  const datasSemana = Array.from({length:7}, (_,i)=> formatoISO(addDias(domingo,i)));
  const { data: registros } = await supa.from('habito_registros').select('*').in('data', datasSemana);
  HABITOS = (habitosRows||[]).map(h=>({
    id: h.id, nome: h.nome,
    semana: datasSemana.map(d => (registros||[]).some(r=>r.habito_id===h.id && r.data===d && r.concluido))
  }));
}
async function alternarHabitoDia(id, idx){
  const h = HABITOS.find(x=>x.id===id);
  h.semana[idx] = !h.semana[idx];
  renderTela();
  const domingo = inicioDaSemana(REF_DOMINGO);
  const dataISO = formatoISO(addDias(domingo, idx));
  const { data: existente } = await supa.from('habito_registros').select('id').eq('habito_id', id).eq('data', dataISO).maybeSingle();
  if(existente){
    await supa.from('habito_registros').update({concluido: h.semana[idx]}).eq('id', existente.id);
  } else {
    await supa.from('habito_registros').insert({habito_id: id, data: dataISO, concluido: h.semana[idx]});
  }
}

  HABITOS.push({id: data.id, nome: nome.trim(), semana:[false,false,false,false,false,false,false]});

  renderTela();
}

async function novaContaPessoal(tipo){
  const desc = prompt(tipo==='receita' ? "Descrição da receita:" : "Descrição da despesa:");
  if(!desc || !desc.trim()) return;
  const valorTxt = prompt("Valor (ex: 350):");
  const valor = parseFloat((valorTxt||'').replace(',','.'));
  if(!valor || valor<=0) return;
  const vencimento = prompt("Vencimento (DD/MM, opcional):", "") || "";
  const { data: { user } } = await supa.auth.getUser();
  const { data, error } = await supa.from('contas_pessoais').insert({
    user_id: user.id, tipo, descricao: desc.trim(), valor, vencimento: vencimentoParaISO(vencimento), status:'aberto'
  }).select().single();
  if(error){ dispararAutomacao('Erro ao lançar', error.message); return; }
  CONTAS_PESSOAIS.push({id:data.id, tipo, desc:desc.trim(), valor, vencimento: vencimento||"—", vencimentoISO:data.vencimento, dataPagamentoISO:null, status:"aberto"});
  dispararAutomacao('Lançamento pessoal adicionado', desc.trim());
  renderTela();
}
async function editarContaPessoal(id){
  const l = CONTAS_PESSOAIS.find(x=>x.id===id);
  const novaDesc = prompt("Descrição:", l.desc);
  if(novaDesc===null || !novaDesc.trim()) return;
  const novoValorTxt = prompt("Valor:", l.valor);
  const novoValor = parseFloat((novoValorTxt||'').replace(',','.'));
  if(!novoValor || novoValor<=0) return;
  l.desc = novaDesc.trim(); l.valor = novoValor;
  renderTela();
  const { error } = await supa.from('contas_pessoais').update({descricao:novaDesc.trim(), valor:novoValor}).eq('id', id);
  if(error){ dispararAutomacao('Erro ao editar lançamento', error.message); return; }
  dispararAutomacao('Lançamento pessoal editado', novaDesc.trim());
}
async function excluirContaPessoal(id){
  const l = CONTAS_PESSOAIS.find(x=>x.id===id);
  if(!confirm(`Excluir "${l.desc}"? Essa ação não pode ser desfeita.`)) return;
  const idx = CONTAS_PESSOAIS.findIndex(x=>x.id===id);
  if(idx>-1) CONTAS_PESSOAIS.splice(idx,1);
  renderTela();
  const { error } = await supa.from('contas_pessoais').delete().eq('id', id);
  if(error){ dispararAutomacao('Erro ao excluir lançamento', error.message); return; }
  dispararAutomacao('Lançamento pessoal excluído', l.desc);
}

async function arquivoMarcaComoDataURL(path){
  if(!path)return null;
  const {data,error}=await supa.storage.from('marca').download(path);if(error)return null;
  return await new Promise(resolve=>{const leitor=new FileReader();leitor.onload=()=>resolve(leitor.result);leitor.readAsDataURL(data);});
}
async function carregarTemaMarcaSupabase(){
  const {data,error}=await supa.from('tema_marca').select('*').limit(1).maybeSingle();
  if(error){dispararAutomacao('Erro ao carregar identidade da marca',error.message);return;}
  if(!data)return;
  Object.assign(TEMA_MARCA,{id:data.id,logoPath:data.logo_url,assinaturaPath:data.assinatura_url});
  [TEMA_MARCA.logoData,TEMA_MARCA.assinaturaData]=await Promise.all([arquivoMarcaComoDataURL(data.logo_url),arquivoMarcaComoDataURL(data.assinatura_url)]);
  if(data.cor_primaria)document.documentElement.style.setProperty('--cor-primaria',data.cor_primaria);
  if(data.cor_acento)document.documentElement.style.setProperty('--cor-acento',data.cor_acento);
}
async function uploadMarca(tipo,input){
  const arquivo=input.files?.[0];if(!arquivo)return;
  if(!arquivo.type.startsWith('image/')){alert('Selecione uma imagem PNG, JPG ou WEBP.');return;}
  const {data:{user}}=await supa.auth.getUser();const ext=(arquivo.name.split('.').pop()||'png').toLowerCase();const path=`${user.id}/${tipo}.${ext}`;
  const {error:erroUpload}=await supa.storage.from('marca').upload(path,arquivo,{upsert:true,contentType:arquivo.type});
  if(erroUpload){dispararAutomacao('Erro no upload',erroUpload.message);return;}
  const campo=tipo==='logo'?'logo_url':'assinatura_url';
  let consulta=TEMA_MARCA.id?supa.from('tema_marca').update({[campo]:path}).eq('id',TEMA_MARCA.id).select().single():supa.from('tema_marca').insert({[campo]:path}).select().single();
  const {data,error}=await consulta;if(error){dispararAutomacao('Erro ao salvar identidade',error.message);return;}
  TEMA_MARCA.id=data.id;TEMA_MARCA[tipo+'Path']=path;TEMA_MARCA[tipo+'Data']=await arquivoMarcaComoDataURL(path);
  dispararAutomacao('Identidade da marca atualizada',tipo==='logo'?'Logo salvo.':'Assinatura salva.');renderTela();
}

/* ---------- MOTOR DE AUTOMAÇÕES (Fase 7) ---------- */
let LOG_AUTOMACOES = [];
let notifNaoLidas = 0;

function dispararAutomacao(titulo, detalhe){
  const agora = new Date();
  const hora = agora.getHours().toString().padStart(2,'0')+':'+agora.getMinutes().toString().padStart(2,'0');
  LOG_AUTOMACOES.unshift({titulo, detalhe, hora});
  notifNaoLidas++;
  mostrarToast(titulo);
  atualizarBadgeNotif();
  if(document.getElementById('painelNotif').classList.contains('aberto')){
    renderPainelNotif();
  }
}

function mostrarToast(msg){
  const container = document.getElementById('toastContainer');
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `<div class="bolinha"></div><div><strong>Automação</strong><br>${msg}</div>`;
  container.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(),300); }, 4200);
}

function atualizarBadgeNotif(){
  const badge = document.getElementById('sinoBadge');
  if(notifNaoLidas > 0){ badge.style.display='flex'; badge.innerText = notifNaoLidas; }
  else { badge.style.display='none'; }
}

function alternarPainelNotif(){
  const painel = document.getElementById('painelNotif');
  painel.classList.toggle('aberto');
  if(painel.classList.contains('aberto')){
    notifNaoLidas = 0;
    atualizarBadgeNotif();
    renderPainelNotif();
  }
}
function limparNotificacoes(){
  LOG_AUTOMACOES = [];
  renderPainelNotif();
}
function renderPainelNotif(){
  const lista = document.getElementById('painelNotifLista');
  if(LOG_AUTOMACOES.length===0){
    lista.innerHTML = `<div class="painel-notif-vazio">Nenhuma automação disparada ainda. Interaja com o sistema (feche uma visita, mova um lead, marque um item do checklist...) para ver aqui.</div>`;
    return;
  }
  lista.innerHTML = LOG_AUTOMACOES.map(n=>`
    <div class="notif-item">
      <div class="notif-item-titulo">${n.titulo}</div>
      ${n.detalhe ? `<div>${n.detalhe}</div>` : ''}
      <div class="notif-item-hora">${n.hora}</div>
    </div>
  `).join('');

/* ---------- CENTRAL DE PENDÊNCIAS (agrega dados reais dos outros módulos) ---------- */
let PENDENCIAS_DB = [];
async function carregarPendenciasSupabase(){
  const { data, error } = await supa.from('pendencias').select('*, clientes(nome)').order('criado_em', {ascending:false});
  if(error){ dispararAutomacao('Erro ao carregar pendências', error.message); return; }
  PENDENCIAS_DB = (data||[]).map(p=>({
    id:p.id, titulo:p.titulo, status:p.status, origem:p.origem,
    clienteId: p.cliente_id,
    cliente: p.clientes ? p.clientes.nome : null,
    prazo: p.prazo ? p.prazo.split('-').reverse().join('/') : null,
    responsavel: p.responsavel || null,
  }));
}
async function novaPendenciaManual(){
  const texto = prompt("Descreva a pendência:");
  if(!texto || !texto.trim()) return;
  const prazoTxt = prompt("Prazo (DD/MM/AAAA, opcional):", "") || "";
  const responsavel = prompt("Responsável:", PERFIL_USUARIO.nome) || PERFIL_USUARIO.nome;
  const prazoISO = prazoTxt ? (()=>{ const [d,m,a]=prazoTxt.split('/'); return d&&m&&a ? `${a}-${m.padStart(2,'0')}-${d.padStart(2,'0')}` : null; })() : null;
  const { data, error } = await supa.from('pendencias').insert({
    titulo: texto.trim(), origem:'manual', status:'aberta', prazo: prazoISO, responsavel
  }).select().single();
  if(error){ dispararAutomacao('Erro ao criar pendência', error.message); return; }
  PENDENCIAS_DB.unshift({id:data.id, titulo:texto.trim(), status:'aberta', origem:'manual', cliente:null, prazo:prazoTxt||null, responsavel});
  dispararAutomacao('Pendência adicionada', texto.trim());
  renderTela();
}
async function avancarStatusPendencia(id){
  const ordem = ['aberta','em_andamento','concluida'];
  const p = PENDENCIAS_DB.find(x=>x.id===id);
  const idx = ordem.indexOf(p.status);
  const proximo = ordem[(idx+1) % ordem.length];
  const {error}=await supa.from('pendencias').update({status:proximo,concluido_em:proximo==='concluida'?new Date().toISOString():null}).eq('id', id);
  if(error){dispararAutomacao('Erro ao atualizar pendência',error.message);return;}
  p.status = proximo;
  renderTela();
}
async function removerPendenciaManual(id){
  PENDENCIAS_DB = PENDENCIAS_DB.filter(p=>p.id!==id);
  renderTela();
  await supa.from('pendencias').delete().eq('id', id);
}

function rotuloStatusPendencia(s){
  return {aberta:'Aberta', em_andamento:'Em andamento', concluida:'Concluída', atrasada:'Atrasada'}[s] || s;
}
function corStatusPendencia(s){
  if(s==='concluida') return 'color:#2F6B4A;font-weight:700;';
  if(s==='atrasada') return 'color:#B0413E;font-weight:700;';
  if(s==='em_andamento') return 'color:#DD6D2D;font-weight:700;';
  return '';
}

/* ---------- MEU ANO EM PIXELS ---------- */
const HUMORES_PIXEL = [
  {id:"tenso", nome:"Tenso", classe:"pixel-tenso"},
  {id:"bom", nome:"Bom", classe:"pixel-bom"},
  {id:"produtivo", nome:"Produtivo", classe:"pixel-produtivo"},
  {id:"otimo", nome:"Ótimo", classe:"pixel-otimo"},
];
let REGISTROS_PIXEL = {}; // chave: "2026-08-02" -> "tenso"|"bom"|"produtivo"|"otimo"
async function carregarPixelSupabase(){
  const { data: { user } } = await supa.auth.getUser();
  const { data, error } = await supa.from('registros_pixel').select('*').eq('user_id', user.id);
  if(error){ dispararAutomacao('Erro ao carregar Ano em Pixels', error.message); return; }
  REGISTROS_PIXEL = {};
  (data||[]).forEach(r=>{ REGISTROS_PIXEL[r.data] = r.humor; });
}

async function marcarPixelDia(dataISO){
  const atual = REGISTROS_PIXEL[dataISO];
  const idx = HUMORES_PIXEL.findIndex(h=>h.id===atual);
  const proximo = idx === -1 ? 0 : (idx+1 < HUMORES_PIXEL.length ? idx+1 : -1);
  const { data: { user } } = await supa.auth.getUser();
  if(proximo === -1){
    delete REGISTROS_PIXEL[dataISO];
    renderTela();
    await supa.from('registros_pixel').delete().eq('user_id', user.id).eq('data', dataISO);
  } else {
    REGISTROS_PIXEL[dataISO] = HUMORES_PIXEL[proximo].id;
    renderTela();
    await supa.from('registros_pixel').upsert({user_id:user.id, data:dataISO, humor:HUMORES_PIXEL[proximo].id}, {onConflict:'user_id,data'});
  }
}

function anoPixelsHTML(){
  const ano = REF_DOMINGO.getFullYear();
  let legenda = `<div class="pixel-legenda">` +
    HUMORES_PIXEL.map(h=>`<div class="legenda-item"><span class="legenda-dot ${h.classe}"></span>${h.nome}</div>`).join('') +
    `<div class="legenda-item"><span class="legenda-dot" style="background:var(--cor-borda);"></span>Sem registro</div></div>`;

  let meses = '';
  for(let m=0; m<12; m++){
    const diasNoMes = new Date(ano, m+1, 0).getDate();
    const primeiroDiaSemana = new Date(ano, m, 1).getDay();
    let celulas = '';
    for(let i=0;i<primeiroDiaSemana;i++) celulas += `<div class="pixel-dia vazio"></div>`;
    for(let d=1; d<=diasNoMes; d++){
      const dataISO = ano+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
      const humor = REGISTROS_PIXEL[dataISO];
      const classeCor = humor ? HUMORES_PIXEL.find(h=>h.id===humor).classe : '';
      celulas += `<div class="pixel-dia ${classeCor}" title="${d}/${m+1}" aria-label="Dia ${d} de ${MESES_NOME[m]}" onclick="marcarPixelDia('${dataISO}')">${d}</div>`;
    }
    meses += `<div class="pixel-mes"><div class="pixel-mes-nome">${MESES_NOME[m]}</div><div class="pixel-grid">${celulas}</div></div>`;
  }

  return `${legenda}<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px;">${meses}</div>
    <div style="margin-top:10px;font-size:11.5px;color:var(--cor-texto-suave);">Toque num dia pra ir passando pelos humores (Tenso → Bom → Produtivo → Ótimo → sem registro). Ano de ${ano}.</div>`;
}

let LIDERANCA_RESPONSAVEIS=[];
let LIDERANCA_DELEGACOES=[];
let LIDERANCA_ATUALIZACOES=[];
let filtroLideranca='ativas';
async function carregarLiderancaSupabase(){
  const [r,d,a]=await Promise.all([
    supa.from('lideranca_responsaveis').select('*').order('nome'),

  ]);
  if(r.error||d.error||a.error){dispararAutomacao('Erro ao carregar Liderança',(r.error||d.error||a.error).message);return;}
  LIDERANCA_RESPONSAVEIS=r.data||[];LIDERANCA_DELEGACOES=d.data||[];LIDERANCA_ATUALIZACOES=a.data||[];

async function novoResponsavelLideranca(){
  const nome=prompt('Nome do responsável:');if(!nome?.trim())return;

  if(error){dispararAutomacao('Erro ao incluir responsável',error.message);return;}LIDERANCA_RESPONSAVEIS.push(data);renderTela();

async function alternarResponsavelLideranca(id){

/* ---------- PERSISTÊNCIA (salvar de verdade — Clientes, Agenda, Visitas e Financeiro) ---------- */
const CHAVE_ESTADO = 'meu-ecossistema-estado-v1';
let armazenamentoDisponivel = false;

async function carregarEstado(){
  try{
    if(!window.storage) return;
    const r = await window.storage.get(CHAVE_ESTADO);
    armazenamentoDisponivel = true;
    if(r && r.value){
      const d = JSON.parse(r.value);
      if(d.CLIENTES) CLIENTES.splice(0, CLIENTES.length, ...d.CLIENTES);
      if(d.eventosSemana) eventosSemana = d.eventosSemana;
      if(d.VISITAS) VISITAS.splice(0, VISITAS.length, ...d.VISITAS);
      if(d.LANCAMENTOS) LANCAMENTOS.splice(0, LANCAMENTOS.length, ...d.LANCAMENTOS);
      if(d.proximoIdEvento) proximoIdEvento = d.proximoIdEvento;
      if(d.proximoIdCliente) proximoIdCliente = d.proximoIdCliente;
      if(d.proximoIdLancamento) proximoIdLancamento = d.proximoIdLancamento;
      if(d.REGISTROS_PIXEL) REGISTROS_PIXEL = d.REGISTROS_PIXEL;
      if(d.ATIVOS) ATIVOS.splice(0, ATIVOS.length, ...d.ATIVOS);
      if(d.proximoIdAtivo) proximoIdAtivo = d.proximoIdAtivo;
      if(d.PERFIL_USUARIO) { /* obsoleto — perfil agora vem do Supabase */ }
    }
  } catch(e){
    // Ainda não há dados salvos, ou o app está sendo aberto fora do ambiente de artefatos do Claude
    // (ex: arquivo baixado e aberto direto no navegador) — nesse caso funciona só como demonstração.
    armazenamentoDisponivel = !!window.storage;
  }
}

async function salvarEstado(){
  registrarAcaoOffline('Alteração de dados');
  try{
    if(!window.storage) return;
    const d = { CLIENTES, eventosSemana, VISITAS, LANCAMENTOS, proximoIdEvento, proximoIdCliente, proximoIdLancamento, REGISTROS_PIXEL, ATIVOS, proximoIdAtivo };
    await window.storage.set(CHAVE_ESTADO, JSON.stringify(d));
  } catch(e){ /* silencioso — não interrompe o uso do app */ }
}

function avisoPersistencia(){
  if(!armazenamentoDisponivel){
    dispararAutomacao('Modo demonstração', 'Abra este app pelo link do Claude (não pelo arquivo baixado) para os dados de Clientes, Agenda e Financeiro serem salvos de verdade entre uma sessão e outra.');
  }
}

/* ---------- MODO OFFLINE INTELIGENTE ---------- */
let filaAcoesOffline = [];

function atualizarStatusConexao(){
  const el = document.getElementById('statusConexao');
  if(!el) return;
  if(navigator.onLine){
    el.classList.remove('offline');
    el.querySelector('.txt').innerText = 'Online';
  } else {
    el.classList.add('offline');
    el.querySelector('.txt').innerText = 'Offline';
  }
}
window.addEventListener('online', ()=>{
  atualizarStatusConexao();
  if(filaAcoesOffline.length>0){
    dispararAutomacao('Conexão restabelecida', `${filaAcoesOffline.length} ação(ões) feita(s) offline foram sincronizadas agora.`);
    filaAcoesOffline = [];
  } else {
    dispararAutomacao('Conexão restabelecida', 'Você está online novamente.');
  }
  salvarEstado();
});
window.addEventListener('offline', ()=>{
  atualizarStatusConexao();
  dispararAutomacao('Você está offline', 'Continue usando normalmente — o que você fizer aqui na visita fica guardado no aparelho e sincroniza sozinho assim que a internet voltar.');
});
function registrarAcaoOffline(descricao){
  if(!navigator.onLine){
    filaAcoesOffline.push({descricao, quando: new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})});
  }
}

async function carregarPerfilSupabase(){
  const { data: { user } } = await supa.auth.getUser();
  if(!user) return;
  const { data, error } = await supa.from('perfil_usuario').select('*').eq('user_id', user.id).maybeSingle();
  if(error){ dispararAutomacao('Erro ao carregar perfil', error.message); return; }
  if(data){
    PERFIL_USUARIO.nome = data.nome || PERFIL_USUARIO.nome;
    PERFIL_USUARIO.email = data.email || user.email || PERFIL_USUARIO.email;
    PERFIL_USUARIO.crn = data.crn || PERFIL_USUARIO.crn;
  } else {
    // primeira vez — cria o registro do perfil já com o e-mail da conta
    PERFIL_USUARIO.email = user.email || PERFIL_USUARIO.email;
    await supa.from('perfil_usuario').insert({
      user_id: user.id, nome: PERFIL_USUARIO.nome, email: PERFIL_USUARIO.email, crn: PERFIL_USUARIO.crn
    });
  }
}
async function editarPerfilCampo(campo, rotulo){
  const valor = prompt(`Editar ${rotulo}:`, PERFIL_USUARIO[campo]);
  if(valor===null || !valor.trim()) return;
  PERFIL_USUARIO[campo] = valor.trim();
  renderTela();
  const { data: { user } } = await supa.auth.getUser();
  if(!user){ dispararAutomacao('Erro ao salvar perfil', 'Sessão não encontrada.'); return; }
  const { error } = await supa.from('perfil_usuario').upsert({
    user_id: user.id, nome: PERFIL_USUARIO.nome, email: PERFIL_USUARIO.email, crn: PERFIL_USUARIO.crn
  }, {onConflict:'user_id'});
  if(error){ dispararAutomacao('Erro ao salvar perfil', error.message); return; }
  dispararAutomacao('Perfil atualizado', `${rotulo} alterado e salvo.`);
}

    <div class="login-campo"><label>Senha</label><input type="password" id="loginSenha" placeholder="Sua senha"></div>
    <button class="login-btn" id="loginBtnEntrar" onclick="tentarLogin()">Entrar</button>
    <div id="loginErro" class="login-erro"></div>
    <div style="text-align:center;margin-top:14px;">
      <button onclick="telaCriarConta()" style="font-size:12px;color:var(--cor-primaria);font-weight:600;">Primeiro acesso? Criar minha conta</button>
    </div>
    <div class="login-aviso">Login real, protegido pelo Supabase — os dados agora ficam salvos na nuvem e sincronizam entre seus aparelhos.</div>`;
  setTimeout(()=>{
    const campoSenha = document.getElementById('loginSenha');
    if(campoSenha) campoSenha.addEventListener('keydown', e=>{ if(e.key==='Enter') tentarLogin(); });
  }, 0);
}
function telaCriarConta(){
  document.getElementById('loginConteudo').innerHTML = `
    <div style="font-size:12px;color:var(--cor-texto-suave);margin-bottom:16px;text-align:center;">Criar sua conta de acesso</div>
    <div class="login-campo"><label>E-mail</label><input type="email" id="cadastroEmail" value="${PERFIL_USUARIO.email}"></div>
    <div class="login-campo"><label>Criar senha</label><input type="password" id="cadastroSenha" placeholder="Mínimo 6 caracteres"></div>
    <div class="login-campo"><label>Confirmar senha</label><input type="password" id="cadastroSenha2"></div>
    <button class="login-btn" id="cadastroBtn" onclick="confirmarCadastro()">Criar conta</button>
    <div id="loginErro" class="login-erro"></div>
    <div style="text-align:center;margin-top:14px;">
      <button onclick="telaLoginNormal()" style="font-size:12px;color:var(--cor-texto-suave);font-weight:600;">← Já tenho conta, voltar pro login</button>
    </div>`;
}
async function confirmarCadastro(){
  const email = document.getElementById('cadastroEmail').value.trim();
  const s1 = document.getElementById('cadastroSenha').value;
  const s2 = document.getElementById('cadastroSenha2').value;
  const erro = document.getElementById('loginErro');
  const btn = document.getElementById('cadastroBtn');
  erro.innerText = '';
  if(!s1 || s1.length<6){ erro.innerText = 'A senha precisa ter pelo menos 6 caracteres.'; return; }
  if(s1!==s2){ erro.innerText = 'As senhas não coincidem.'; return; }
  btn.innerText = 'Criando...'; btn.disabled = true;
  const { data, error } = await supa.auth.signUp({ email, password: s1 });
  btn.innerText = 'Criar conta'; btn.disabled = false;
  if(error){ erro.innerText = error.message; return; }
  if(data.session){
    // conta criada e já logada (confirmação de e-mail desativada no projeto)
    entrarNoApp();
  } else {
    document.getElementById('loginConteudo').innerHTML = `
      <div style="text-align:center;padding:10px 0;">
        <div class="serif" style="font-size:16px;margin-bottom:10px;">Quase lá! 📩</div>
        <div style="font-size:12.5px;color:var(--cor-texto-suave);">Enviamos um e-mail de confirmação pra <strong>${email}</strong>. Clique no link do e-mail e depois volte aqui pra entrar.</div>
        <button class="login-btn" style="margin-top:18px;" onclick="telaLoginNormal()">Voltar para o login</button>
      </div>`;
  }
}
async function tentarLogin(){
  const email = document.getElementById('loginEmail').value.trim();
  const senha = document.getElementById('loginSenha').value;
  const erro = document.getElementById('loginErro');
  const btn = document.getElementById('loginBtnEntrar');
  erro.innerText = '';
  btn.innerText = 'Entrando...'; btn.disabled = true;
  const { data, error } = await supa.auth.signInWithPassword({ email, password: senha });
  btn.innerText = 'Entrar'; btn.disabled = false;
  if(error){
    erro.innerText = error.message.includes('Invalid login credentials')
      ? 'E-mail ou senha incorretos. Confira se o usuário já foi criado no Supabase (Authentication → Users).'
      : error.message;
    return;
  }
  entrarNoApp();
}
async function entrarNoApp(){
  document.getElementById('telaLogin').style.display = 'none';
  document.getElementById('appRoot').classList.add('ativo');
  await carregarPerfilSupabase();
  await carregarTemaMarcaSupabase();
  await carregarClientesSupabase();
  await carregarModeloChecklistSupabase();
  await carregarVisitasSupabase();
  await carregarEventosSupabase();
  await carregarLancamentosSupabase();
  await carregarLeadsSupabase();
  await carregarAtivosSupabase();
  await carregarHabitosSupabase();
  await carregarMetasPessoaisSupabase();
  await carregarContasPessoaisSupabase();
  await carregarComprasSupabase();
  await carregarIdeiasPessoaisSupabase();
  await carregarCicloSupabase();
  await carregarPixelSupabase();
  await carregarProjetosSupabase();
  await carregarMarketingSupabase();
  await carregarPendenciasSupabase();
  await carregarLiderancaSupabase();
  restaurarTelaAtualSessao();
  renderSidebar();
  renderTela();
  setTimeout(verificarPendenciasAtrasadas, 2200);
}
function restaurarTelaAtualSessao(){
  try{
    const tela = sessionStorage.getItem('me_tela_atual');
    const espaco = sessionStorage.getItem('me_espaco_atual');
    const visita = sessionStorage.getItem('me_visita_selecionada');
    const cliente = sessionStorage.getItem('me_cliente_selecionado');
    const etapa = sessionStorage.getItem('me_etapa_visita');
    if(espaco){ espacoAtual = espaco; document.body.setAttribute('data-espaco', espaco); }
    if(tela){ telaAtual = tela; }
    if(visita){ visitaSelecionadaId = visita; const v = VISITAS.find(x=>x.id===visita); if(v) etapaVisitaAtual = v.status==='concluida'?'apos':etapaVisitaAtual; }
    if(cliente){ clienteSelecionadoId = cliente; }
    if(etapa && ['durante','apos'].includes(etapa)) etapaVisitaAtual = etapa;
  } catch(e){}
}
async function sairDaConta(){
  await supa.auth.signOut();
  document.getElementById('appRoot').classList.remove('ativo');
  document.getElementById('telaLogin').style.display = 'flex';
  telaLoginNormal();
}

async function iniciarApp(){
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('/service-worker.js').catch(()=>{});
  }
  await carregarEstado();
  atualizarStatusConexao();
  renderSidebar();
  renderTela();
  const { data: { session } } = await supa.auth.getSession();
  if(session){
    entrarNoApp();
  } else {
    telaLoginNormal();
  }
}
function verificarPendenciasAtrasadas(){
  const atrasados = LANCAMENTOS.filter(l=>statusRealLancamento(l)==='atrasado').length;
  if(atrasados>0){
    dispararAutomacao('Verificação automática de pendências', `${atrasados} lançamento(s) financeiro(s) atrasado(s) — veja em Pendências.`);
  }
}
iniciarApp();
</script>
</body>
</html>
